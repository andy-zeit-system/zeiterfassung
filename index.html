<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zeiten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Zeiterfassung</title>
<style>
:root{
  --bg:#f3f5f7;--surface:#fff;--surface2:#eef1f4;--line:#e1e6ea;--txt:#16202a;--mut:#687583;
  --acc:#0f766e;--acc-ink:#fff;--acc-soft:#e3f3f1;
  --work:#0f766e;--vac:#d97706;--sick:#dc2626;--hol:#7c3aed;--pos:#15803d;--neg:#c2410c;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1215;--surface:#161b1f;--surface2:#1d2429;--line:#283137;--txt:#e7ecef;--mut:#94a1ab;
  --acc:#2dd4bf;--acc-ink:#062b27;--acc-soft:#123430;
  --work:#2dd4bf;--vac:#fbbf24;--sick:#f87171;--hol:#a78bfa;--pos:#4ade80;--neg:#fb923c;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0e1215;--surface:#161b1f;--surface2:#1d2429;--line:#283137;--txt:#e7ecef;--mut:#94a1ab;
  --acc:#2dd4bf;--acc-ink:#062b27;--acc-soft:#123430;
  --work:#2dd4bf;--vac:#fbbf24;--sick:#f87171;--hol:#a78bfa;--pos:#4ade80;--neg:#fb923c;--shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--txt);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.warn{border:1px solid var(--neg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.5}
.warnbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--txt);margin:0;padding:7px 0;cursor:pointer}
.chk input{width:20px;min-height:20px;height:20px;padding:0;flex:none;accent-color:var(--acc)}
.chk .muted{margin-left:auto;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.hidden{display:none!important}

/* Layout */
.app{display:flex;min-height:100vh}
nav.side{width:232px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 10px 18px}
.brand img{width:32px;height:32px;border-radius:9px}
nav.side button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mut);font-weight:500;text-align:left}
nav.side button svg{width:20px;height:20px;flex-shrink:0}
nav.side button:hover{background:var(--surface2);color:var(--txt)}
nav.side button.on{background:var(--acc-soft);color:var(--acc)}
nav.side .who{margin-top:auto;font-size:12px;color:var(--mut);padding:10px 12px;overflow-wrap:anywhere}
main{flex:1;min-width:0;padding-bottom:40px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px max(24px,calc((100% - 760px)/2 + 24px)) 12px;display:flex;align-items:center;gap:8px;min-height:64px}
.top h1{font-size:22px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-size:13px;color:var(--mut);font-weight:500}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--pos);flex-shrink:0;margin-left:4px}
.sync.busy{background:var(--vac);animation:pulse 1s infinite}.sync.err{background:var(--sick)}
@keyframes pulse{50%{opacity:.3}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px;background:var(--surface);border:1px solid var(--line);color:var(--txt);white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{color:var(--sick)}
.btn.small{min-height:34px;padding:5px 11px;font-size:13.5px}
.ibtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--txt);flex-shrink:0}
.ibtn:hover{background:var(--surface2)}
.ibtn svg{width:20px;height:20px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--acc);color:var(--acc-ink);display:none;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:8}
.fab svg{width:26px;height:26px}

/* Karten */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px}
.sec{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 4px 8px;display:flex;justify-content:space-between;gap:8px}

/* Woche */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.day .wd{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase}
.day .dn{font-size:18px;font-weight:700}
.day .dh{font-size:11px;color:var(--mut);min-height:16px}
.day.sun .wd{color:var(--sick)}
.day.hol .wd{color:var(--hol)}
.day.today{border-color:var(--acc);border-width:2px;padding:7px 0 6px}
.day.sel{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.day.sel .wd,.day.sel .dh{color:var(--acc-ink);opacity:.85}
.weeksum{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:2px 4px 0}

/* Einträge */
.entry{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);width:100%;text-align:left}
.entry:hover{border-color:var(--mut)}
.entry .stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--work);flex-shrink:0}
.entry.Urlaub .stripe{background:var(--vac)}.entry.Krankheit .stripe{background:var(--sick)}.entry.Feiertag .stripe{background:var(--hol)}
.entry.Feiertag{cursor:default}.entry.Feiertag:hover{border-color:var(--line)}
.entry .body{flex:1;min-width:0}
.entry .t{font-weight:600}
.entry .s{font-size:13px;color:var(--mut)}
.entry .tag{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;border:1px solid var(--hol);color:var(--hol);margin-left:6px;vertical-align:1px}
.entry .note{font-size:13.5px;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}
.entry .h{font-weight:700;font-size:16px;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:32px 12px;border:1.5px dashed var(--line);border-radius:var(--r)}

/* Monate */
.mcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.mcard:hover{border-color:var(--mut)}
.mcard .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mcard .row1 b{font-size:16px}
.mcard .row2{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:8px}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface2);border-radius:12px;padding:12px 6px;text-align:center}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--mut);text-align:left;font-weight:600;padding:6px 4px;text-transform:uppercase;letter-spacing:.04em}
td{padding:8px 4px;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--txt);box-shadow:var(--shadow)}

/* Einstellungen */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:54px}
.list>div:first-child{border-top:0}
.list input,.list select{width:160px;text-align:right}
.list .wide{flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;min-width:42px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.vac{background:linear-gradient(135deg,color-mix(in srgb,var(--vac) 20%,var(--surface)),var(--surface))}

/* Dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--txt);border-radius:20px;width:min(480px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,10,15,.5)}
dialog form{padding:20px;overflow:auto;max-height:92vh}
dialog h2{margin:0 0 16px;font-size:19px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:16px}
.seg button{padding:9px;border-radius:9px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--surface);color:var(--txt);box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:5px}
.calc{font-size:15px;font-weight:600;color:var(--acc);min-height:22px;margin:6px 0 14px}
.actions{display:flex;gap:8px;justify-content:space-between;align-items:center}
.actions span{display:flex;gap:8px}

/* Anmeldung */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .box{width:min(380px,100%)}
.login img{width:60px;height:60px;border-radius:16px;display:block;margin:0 auto 14px}
.login h1{text-align:center;font-size:24px;margin:0 0 4px}
.login p{text-align:center;margin:0 0 22px}
.login .card{padding:20px}
.linkbtn{color:var(--acc);font-weight:600;font-size:14px;padding:6px 0}
.msg{font-size:14px;margin-top:8px;text-align:center;min-height:20px}
.msg.err{color:var(--sick)}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Handy */
@media (max-width:820px){
  .app{flex-direction:column}
  nav.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0}
  .brand,nav.side .who{display:none}
  nav.side button{flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:4px 2px;flex:1;max-width:96px}
  nav.side button:hover{background:none}
  nav.side button.on{background:none}
  nav.side button.on svg{background:var(--acc-soft);border-radius:999px;padding:3px 16px;width:56px;height:28px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .top{padding:calc(12px + env(safe-area-inset-top)) 12px 10px 16px;gap:4px}
  .top h1{font-size:20px}
  .wrap{padding:0 16px}
  .fab{display:grid}
  .hide-m{display:none!important}
  .week{gap:4px}
  .day .dn{font-size:16px}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:94vh}
  dialog form{padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  .list input,.list select{width:130px}
}
@media (max-width:400px){.g3{grid-template-columns:1fr 1fr}.g3>div:last-child{grid-column:span 2}.kpi .v{font-size:18px}.big{font-size:26px}}
@media print{
  nav.side,.fab,.noprint,#toast,.sync{display:none!important}
  body,main{background:#fff;color:#000}
  .top{position:static;background:#fff}
  .card,.entry,.kpi{box-shadow:none;border-color:#ccc;background:#fff}
}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
// ---------- Verbindung ----------
// Öffentliche Projektangaben (kein Geheimnis). Die Daten sind durch Anmeldung + Row Level Security geschützt.
const SB_URL='https://qtidstkbbnddllkpthpb.supabase.co';
const SB_KEY='sb_publishable_FACSzfUELibVAgrlb8t8pQ_fOJlzfoJ';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

// ---------- Symbole ----------
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={
  clock:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  cal:svg('<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/>'),
  chart:svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  gear:svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  left:svg('<path d="M15 18l-6-6 6-6"/>'),
  right:svg('<path d="M9 18l6-6-6-6"/>'),
  back:svg('<path d="M19 12H5M12 19l-7-7 7-7"/>'),
};

// ---------- Daten ----------
const DEFAULT_SETTINGS={name:'',company:'',rates:[{from:'2000-01-01',rate:0}],dailySoll:4.98,monthlySoll:0,workdays:[1,2,3,4,5,6],defaultStart:'08:00',defaultEnd:'12:00',defaultPause:0,holidayState:'NI',holidayPaid:'',holidays:[],vacationPerYear:0,vacationCarry:{},overtimeStart:0,overtimeCarry:{},overtimePayout:{},rb:{},rbUeb:2.5,rbVoll:5,rbSoFei:10,rbAbg:2.5,startDate:''};
let DB={settings:{...DEFAULT_SETTINGS},entries:[]}, USER=null, lastFetch=0;
const cacheKey=()=>'zeit.cache.'+(USER&&USER.id);
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));

const toRow=e=>({user_id:USER.id,id:String(e.id),date:e.date,type:e.type,
  start_time:e.type==='Arbeit'?e.start:null,end_time:e.type==='Arbeit'?e.end:null,pause:e.type==='Arbeit'?(+e.pause||0):0,
  hours:e.type==='Arbeit'?null:(e.hours??null),reason:e.type==='Arbeit'?null:(e.reason||null),note:e.note||null,updated_at:new Date().toISOString()});
const fromRow=r=>r.type==='Arbeit'
  ?{id:r.id,date:r.date,type:r.type,start:(r.start_time||'').slice(0,5),end:(r.end_time||'').slice(0,5),pause:r.pause||0,note:r.note||''}
  :{id:r.id,date:r.date,type:r.type,hours:r.hours!=null?+r.hours:null,reason:r.reason||'',note:r.note||''};

function setSync(state){const el=document.getElementById('sync');if(el){el.className='sync '+(state||'');el.title={busy:'Wird gespeichert…',err:'Keine Verbindung – nicht gespeichert'}[state]||'Gespeichert'}}
function cacheSave(){try{localStorage.setItem(cacheKey(),JSON.stringify(DB))}catch(e){}}
function cacheLoad(){try{const s=localStorage.getItem(cacheKey());if(s){DB=JSON.parse(s);DB.settings={...DEFAULT_SETTINGS,...DB.settings};return true}}catch(e){}return false}
function clearHol(){for(const k in _hol) delete _hol[k]}

async function fetchAll(){
  setSync('busy');
  const st=await sb.from('settings').select('data').maybeSingle();
  if(st.error) throw st.error;
  const all=[]; const N=1000;
  for(let from=0;;from+=N){
    const r=await sb.from('entries').select('*').order('date').order('id').range(from,from+N-1);
    if(r.error) throw r.error;
    all.push(...r.data); if(r.data.length<N) break;
  }
  DB={settings:{...DEFAULT_SETTINGS,...((st.data&&st.data.data)||{})},entries:all.map(fromRow)};
  clearHol(); cacheSave(); setSync(); lastFetch=Date.now();
}
async function refresh(silent){
  try{await fetchAll(); render();}
  catch(e){setSync('err'); if(!silent) toast('Laden fehlgeschlagen: '+(e.message||e));}
}
async function saveEntries(list){
  cacheSave(); setSync('busy');
  const {error}=await sb.from('entries').upsert(list.map(toRow),{onConflict:'user_id,id'});
  if(error){setSync('err');toast('Nicht gespeichert: '+error.message);await refresh(true);return false}
  setSync(); return true;
}
async function deleteEntry(id){
  const gone=DB.entries.find(x=>x.id===id);
  DB.entries=DB.entries.filter(x=>x.id!==id); if(gone)rbClearIfEmpty(gone.date); cacheSave(); render(); setSync('busy');
  const {error}=await sb.from('entries').delete().eq('id',id);
  if(error){setSync('err');toast('Löschen fehlgeschlagen: '+error.message);await refresh(true);return}
  setSync(); toast('Gelöscht');
}
let setTimer=null;
function saveSettings(){
  clearHol(); cacheSave(); setSync('busy'); clearTimeout(setTimer);
  setTimer=setTimeout(async()=>{
    const {error}=await sb.from('settings').upsert({user_id:USER.id,data:DB.settings,updated_at:new Date().toISOString()});
    if(error){setSync('err');toast('Einstellungen nicht gespeichert: '+error.message)} else setSync();
  },500);
}

// ---------- Hilfen ----------
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const fmt=(n,d=2)=>(Math.round(n*100)/100).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:d});
const hmin=h=>{const m=Math.round(h*60);return Math.floor(m/60)+':'+pad(m%60)};
const fmtS=n=>(Math.round(n*100)>0?'+':'')+fmt(n);
const eur=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const dlbl=s=>{const d=parseIso(s);return WD[d.getDay()]+'., '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()};
const dlong=s=>{const d=parseIso(s);return WDL[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]};
const toMin=t=>{const[h,m]=(t||'0:0').split(':').map(Number);return h*60+m};
function hours(e){
  if(e.type!=='Arbeit') return e.hours!=null?e.hours:DB.settings.dailySoll;
  let m=toMin(e.end)-toMin(e.start); if(m<0)m+=1440;
  return (m-(+e.pause||0))/60;
}
function pauseLbl(p){p=+p||0;if(!p)return'';return p%60===0?(p/60)+' Std.':p>60?Math.floor(p/60)+' Std. '+(p%60)+' Min.':p+' Min.'}
function rateFor(s){const r=(DB.settings.rates||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));let v=r.length?r[0].rate:0;r.forEach(x=>{if(x.from<=s)v=x.rate});return +v}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
const _hol={};
function holidaysOf(y){
  const key=y+'|'+DB.settings.holidayState; if(_hol[key]) return _hol[key];
  const r={}; if(DB.settings.holidayState==='NI'){
    const e=easter(y),off=n=>{const d=new Date(e);d.setDate(d.getDate()+n);return iso(d)};
    Object.assign(r,{[y+'-01-01']:'Neujahr',[off(-2)]:'Karfreitag',[off(1)]:'Ostermontag',[y+'-05-01']:'Tag der Arbeit',[off(39)]:'Christi Himmelfahrt',[off(50)]:'Pfingstmontag',[y+'-10-03']:'Tag der Deutschen Einheit',[y+'-10-31']:'Reformationstag',[y+'-12-25']:'1. Weihnachtsfeiertag',[y+'-12-26']:'2. Weihnachtsfeiertag'});
  }
  return _hol[key]=r;
}
const isHoliday=s=>holidaysOf(+s.slice(0,4))[s]||((DB.settings.holidays||[]).find(h=>h.date===s)||{}).name||'';
// Sonn-/Feiertagszuschlag: liefert 'Sonntag' bzw. den Feiertagsnamen, sonst ''. Maßgeblich ist das Datum des Eintrags.
const sfName=s=>isHoliday(s)||(parseIso(s).getDay()===0?'Sonntag':'');
// Rufbereitschaft: je Tag höchstens eine Art, gespeichert in den Einstellungen (settings.rb = {'JJJJ-MM-TT': 'ueb'|'voll'|'abg'}).
// Sätze: übernommen 2,50 €, voll 5 € (Sonn-/Feiertag 10 €), abgegeben 2,50 € – in den Einstellungen änderbar.
const RB_KINDS=[['ueb','Rufbereitschaft übernommen'],['voll','Rufbereitschaft'],['abg','Rufbereitschaft abgegeben']];
const rbLabel=k=>(RB_KINDS.find(x=>x[0]===k)||[])[1]||'';
const rbOf=d=>{const k=(DB.settings.rb||{})[d];return rbLabel(k)?k:''};
function rbPrice(k,d){const s=DB.settings,n=(v,def)=>v===undefined||v===null||v===''?def:+v;
  return k==='ueb'?n(s.rbUeb,2.5):k==='abg'?n(s.rbAbg,2.5):k==='voll'?(sfName(d)?n(s.rbSoFei,10):n(s.rbVoll,5)):0}
function rbMonth(y,m){const p=y+'-'+pad(m+1)+'-';return Object.keys(DB.settings.rb||{}).filter(d=>d.startsWith(p)&&rbOf(d)).sort().map(d=>({date:d,kind:rbOf(d),eur:rbPrice(rbOf(d),d)}))}
const rbHead=d=>rbOf(d)?' · '+rbLabel(rbOf(d))+' '+eur(rbPrice(rbOf(d),d)):'';
function rbClearIfEmpty(d){const s=DB.settings;if(d&&(s.rb||{})[d]&&!DB.entries.some(x=>x.date===d)){const o={...s.rb};delete o[d];s.rb=o;saveSettings()}}
function isWorkday(d){return DB.settings.workdays.includes(d.getDay())&&!isHoliday(iso(d))}
const LOHN_ORDER=['Zeitlohn','Urlaubslohn','Krankheitslohn','Feiertagslohn'];
function monthStats(y,m){
  const from=iso(new Date(y,m,1)), to=iso(new Date(y,m+1,0));
  const list=DB.entries.filter(e=>e.date>=from&&e.date<=to);
  let soll=0; const st=DB.settings.startDate, ds=DB.settings.dailySoll;
  const lohn={}; const add=(k,h,s)=>{const key=k+'|'+rateFor(s);lohn[key]=(lohn[key]||0)+h};
  const feiertage=[];
  for(let d=new Date(y,m,1);d.getMonth()===m;d.setDate(d.getDate()+1)){
    const s=iso(d); if((st&&s<st)||!DB.settings.workdays.includes(d.getDay())) continue;
    soll+=ds;
    // Feiertag auf Arbeitstag ohne Eintrag: freier Tag. Nur wenn in den Einstellungen so gewählt, wird er bezahlt gutgeschrieben (Feiertagslohn).
    if(isHoliday(s) && !list.some(e=>e.date===s)){ if(DB.settings.holidayPaid) add('Feiertagslohn',ds,s); feiertage.push(s); }
  }
  // Festes Monats-Soll (z. B. 130 Std. laut Vertrag) ersetzt das nach Arbeitstagen gezählte Soll; Monate vor dem Startdatum haben kein Soll.
  if(+DB.settings.monthlySoll>0) soll=(st&&to<st)?0:+DB.settings.monthlySoll;
  const KIND={Arbeit:'Zeitlohn',Urlaub:'Urlaubslohn',Krankheit:'Krankheitslohn'};
  list.forEach(e=>add(KIND[e.type],hours(e),e.date));
  const r2=n=>Math.round(n*100)/100;
  const rows=Object.entries(lohn).map(([k,h])=>{const[name,rate]=k.split('|');return{name,rate:+rate,h:r2(h),betrag:r2(r2(h)*rate)}})
    .sort((a,b)=>LOHN_ORDER.indexOf(a.name)-LOHN_ORDER.indexOf(b.name)||a.rate-b.rate);
  const ist=rows.reduce((a,r)=>a+r.h,0);
  // Gearbeitete Stunden an Sonn- und Feiertagen (Grundlage für den Zuschlag), je Tag zusammengefasst
  const sfMap={}; list.forEach(e=>{if(e.type==='Arbeit'&&sfName(e.date))sfMap[e.date]=(sfMap[e.date]||0)+hours(e)});
  const sfTage=Object.keys(sfMap).sort().map(d=>({date:d,name:sfName(d),h:r2(sfMap[d])}));
  return {list,rows,feiertage,sfTage,sfStd:r2(sfTage.reduce((a,t)=>a+t.h,0)),soll:r2(soll),ist:r2(ist),diff:r2(ist-soll),brutto:r2(rows.reduce((a,r)=>a+r.betrag,0)),
    urlaub:new Set(list.filter(e=>e.type==='Urlaub').map(e=>e.date)).size,krank:new Set(list.filter(e=>e.type==='Krankheit').map(e=>e.date)).size};
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT; function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2800)}

// ---------- Grundgerüst ----------
const R=document.getElementById('root');
let view='zeit', selDate=iso(new Date()), monthOpen=null, tab='ueber', M=null;
const NAV=[['zeit','Zeiten',IC.clock],['monate','Monate',IC.cal],['auswertung','Auswertung',IC.chart],['einst','Einstellungen',IC.gear]];
function shell(){
  R.innerHTML=`<div class="app"><nav class="side">
    <div class="brand"><img src="icon.svg" alt="">Zeiterfassung</div>
    ${NAV.map(([k,l,i])=>`<button data-v="${k}">${i}<span>${l}</span></button>`).join('')}
    <div class="who">${esc(USER.email)}</div></nav>
    <main id="main"></main></div>
    <button class="fab noprint" id="fab" aria-label="Neuer Eintrag">${IC.plus}</button>`;
  M=document.getElementById('main');
  R.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
  document.getElementById('fab').onclick=()=>editEntry(null);
}
function go(v){view=v;monthOpen=null;render();window.scrollTo(0,0)}
function topBar(title,extra='',backBtn=false){
  return `<div class="top">${backBtn?`<button class="ibtn" id="back" aria-label="Zurück">${IC.back}</button>`:''}<h1>${title}</h1>${extra}<span class="sync" id="sync" title="Gespeichert"></span></div>`;
}
function render(){
  if(!M) return;
  R.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.getElementById('fab').classList.toggle('hidden',view==='einst');
  if(view==='zeit') vZeit();
  else if(view==='monate') monthOpen?vMonat():vMonate();
  else if(view==='auswertung') vAuswertung();
  else vEinst();
}

function entryHtml(e){
  const line=e.type==='Arbeit'?`${e.start} – ${e.end}${e.pause?' · Pause '+pauseLbl(e.pause):''}`:(e.reason||'Ganzer Tag');
  return `<button class="entry ${e.type}" data-id="${esc(e.id)}"><span class="stripe"></span><span class="body"><div class="t">${e.type}${e.type==='Arbeit'&&sfName(e.date)?`<span class="tag">${esc(sfName(e.date))}</span>`:''}</div><div class="s num">${esc(line)}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:''}</span><span class="h num">${fmt(hours(e))} h</span></button>`;
}
const holidayHtml=d=>`<div class="entry Feiertag"><span class="stripe"></span><span class="body"><div class="t">Feiertag</div><div class="s">${esc(isHoliday(d))}</div></span><span class="h num">${DB.settings.holidayPaid?fmt(DB.settings.dailySoll)+' h':'frei'}</span></div>`;
function bindEntries(){M.querySelectorAll('button.entry').forEach(el=>el.onclick=()=>editEntry(DB.entries.find(e=>e.id===el.dataset.id)));}

// ---------- Ansicht: Zeiten ----------
function vZeit(){
  const sd=parseIso(selDate); const mon=new Date(sd); mon.setDate(sd.getDate()-((sd.getDay()+6)%7));
  const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d});
  const kw=(d=>{d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y)/864e5+1)/7)})(sd);
  const today=iso(new Date()), a=iso(days[0]), b=iso(days[6]);
  const byDay={}; DB.entries.forEach(e=>{if(e.date>=a&&e.date<=b)(byDay[e.date]=byDay[e.date]||[]).push(e)});
  const list=(byDay[selDate]||[]).sort((x,y)=>(x.start||'').localeCompare(y.start||''));
  const sum=list.reduce((s,e)=>s+hours(e),0);
  const wsum=Object.values(byDay).flat().reduce((s,e)=>s+hours(e),0);
  const st=DB.settings; let wsoll=0; days.forEach(d=>{if(st.workdays.includes(d.getDay())&&(!st.startDate||iso(d)>=st.startDate))wsoll+=st.dailySoll});
  const hol=isHoliday(selDate);
  M.innerHTML=topBar(`${MON[sd.getMonth()]} ${sd.getFullYear()} <small>KW ${kw}</small>`,
    `<button class="ibtn" id="prev" aria-label="Vorige Woche">${IC.left}</button><button class="btn small" id="today">Heute</button><button class="ibtn" id="next" aria-label="Nächste Woche">${IC.right}</button><button class="btn pri hide-m" id="add" style="margin-left:6px">${IC.plus} Eintrag</button>`)+
   `<div class="wrap">
    <div class="week">${days.map(d=>{const s=iso(d);const h=(byDay[s]||[]).reduce((x,e)=>x+hours(e),0);
      return `<button class="day ${s===selDate?'sel':''} ${s===today?'today':''} ${d.getDay()===0?'sun':''} ${isHoliday(s)?'hol':''}" data-d="${s}"><span class="wd">${WD[d.getDay()]}</span><span class="dn">${d.getDate()}</span><span class="dh num">${h?fmt(h,1):''}</span></button>`}).join('')}</div>
    <div class="weeksum num"><span>Woche: ${fmt(wsum)} von ${fmt(wsoll)} Std.</span><span class="${wsum-wsoll>=0?'pos':'neg'}">${fmtS(wsum-wsoll)}</span></div>
    <div class="sec"><span>${dlong(selDate)}${hol?' · '+esc(hol):''}${rbHead(selDate)}</span><span class="num">${list.length?fmt(sum)+' Std.':''}</span></div>
    ${hol&&!list.length&&st.workdays.includes(sd.getDay())?holidayHtml(selDate):''}
    ${list.map(entryHtml).join('')||(hol?'':`<div class="empty">Noch kein Eintrag an diesem Tag.<br><br><button class="btn pri" id="add2">${IC.plus} Eintrag hinzufügen</button></div>`)}
   </div>`;
  M.querySelectorAll('.day').forEach(el=>el.onclick=()=>{selDate=el.dataset.d;render()});
  const shift=n=>{const d=parseIso(selDate);d.setDate(d.getDate()+n);selDate=iso(d);render()};
  M.querySelector('#prev').onclick=()=>shift(-7); M.querySelector('#next').onclick=()=>shift(7);
  M.querySelector('#today').onclick=()=>{selDate=iso(new Date());render()};
  M.querySelectorAll('#add,#add2').forEach(el=>el.onclick=()=>editEntry(null));
  bindEntries();
}

// ---------- Ansicht: Monate ----------
function monthsWithData(){
  const set=new Set(DB.entries.map(e=>e.date.slice(0,7)));
  const now=new Date(); set.add(now.getFullYear()+'-'+pad(now.getMonth()+1));
  return [...set].sort().reverse();
}
function vMonate(){
  let lastY='';
  M.innerHTML=topBar('Monate')+`<div class="wrap">${monthsWithData().map(k=>{const[y,m]=k.split('-').map(Number);const st=monthStats(y,m-1);
    const pct=st.soll?Math.min(100,st.ist/st.soll*100):0; const head=String(y)!==lastY?`<div class="sec"><span>${y}</span></div>`:''; lastY=String(y);
    return `${head}<button class="mcard" data-k="${k}"><div class="row1"><b>${MON[m-1]}</b><span class="num ${st.diff>=0?'pos':'neg'}" style="font-weight:700">${fmtS(st.diff)} h</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row2 num"><span>${fmt(st.ist)} von ${fmt(st.soll)} Std.</span>${st.sfStd?`<span>So/Feiertag ${fmt(st.sfStd)} Std.</span>`:''}<span>${eur(st.brutto)}</span></div></button>`}).join('')}</div>`;
  M.querySelectorAll('.mcard').forEach(el=>el.onclick=()=>{monthOpen=el.dataset.k;render();window.scrollTo(0,0)});
}
function vMonat(){
  const[y,m]=monthOpen.split('-').map(Number); const st=monthStats(y,m-1); const s=DB.settings; const rbT=rbMonth(y,m-1);
  const pct=st.soll?Math.round(st.ist/st.soll*100):0;
  const byDay={}; st.list.forEach(e=>(byDay[e.date]=byDay[e.date]||[]).push(e));
  const days=[...new Set([...Object.keys(byDay),...st.feiertage])].sort().reverse();
  M.innerHTML=topBar(`${MON[m-1]} ${y}`,`<button class="btn small noprint" id="csv">CSV</button><button class="btn small noprint" id="pdf">Drucken</button>`,true)+`<div class="wrap">
   <div class="card">
    <div class="hero"><div><div class="muted" style="font-size:13px">${esc(s.name)}${s.company?' · '+esc(s.company):''}</div><div class="muted" style="font-size:12px">Bruttolohn (Schätzung)</div><div class="big num pos">${eur(st.brutto)}</div></div><div class="big num">${pct}%</div></div>
    <div class="kpis num"><div class="kpi"><div class="l">Ist</div><div class="v">${fmt(st.ist)}</div></div><div class="kpi"><div class="l">Soll</div><div class="v">${fmt(st.soll)}</div></div><div class="kpi"><div class="l">Differenz</div><div class="v ${st.diff>=0?'pos':'neg'}">${fmtS(st.diff)}</div></div></div>
   </div>
   <div class="card"><h2>Lohnabrechnung</h2><table class="num"><tr><th>Bezeichnung</th><th class="r">Std.</th><th class="r">€/Std.</th><th class="r">Betrag</th></tr>
    ${st.rows.map(r=>`<tr><td>${r.name}</td><td class="r">${fmt(r.h)}</td><td class="r">${fmt(r.rate)}</td><td class="r">${eur(r.betrag)}</td></tr>`).join('')}
    <tr><td colspan="3"><b>Gesamt</b></td><td class="r"><b>${eur(st.brutto)}</b></td></tr></table>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">Urlaub ${st.urlaub} Tg. · Krank ${st.krank} Tg. · Feiertage ${st.feiertage.length} · ohne Zuschläge</p></div>
   <div class="card"><h2>Sonn- und Feiertagsarbeit</h2>
    ${st.sfTage.length?`<table class="num"><tr><th>Tag</th><th>Art</th><th class="r">Std.</th><th class="r">Std:Min</th></tr>
    ${st.sfTage.map(t=>`<tr><td>${dlbl(t.date)}</td><td>${esc(t.name)}</td><td class="r">${fmt(t.h)}</td><td class="r">${hmin(t.h)}</td></tr>`).join('')}
    <tr><td colspan="2"><b>Stunden mit Zuschlag</b></td><td class="r"><b>${fmt(st.sfStd)}</b></td><td class="r"><b>${hmin(st.sfStd)}</b></td></tr></table>`
    :'<p class="muted" style="margin:0">In diesem Monat wurde an keinem Sonntag oder Feiertag gearbeitet.</p>'}
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">Gezählt wird die Arbeitszeit ohne Pausen an Sonntagen und gesetzlichen Feiertagen (Niedersachsen). Urlaub und Krankheit zählen nicht.</p></div>
   <div class="card"><h2>Rufbereitschaft</h2>
    ${rbT.length?`<table class="num"><tr><th>Tag</th><th>Art</th><th class="r">Betrag</th></tr>
    ${rbT.map(t=>`<tr><td>${dlbl(t.date)}</td><td>${t.kind==='ueb'?'übernommen':t.kind==='abg'?'abgegeben':sfName(t.date)?'Rufbereitschaft ('+esc(sfName(t.date))+')':'Rufbereitschaft'}</td><td class="r">${eur(t.eur)}</td></tr>`).join('')}
    <tr><td colspan="2"><b>Summe ${rbT.length} ${rbT.length===1?'Tag':'Tage'}</b></td><td class="r"><b>${eur(rbT.reduce((a,t)=>a+t.eur,0))}</b></td></tr></table>`
    :'<p class="muted" style="margin:0">In diesem Monat ist keine Rufbereitschaft eingetragen.</p>'}
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">Eintragen: einen Arbeitseintrag des Tages öffnen und die Art ankreuzen. Der Betrag ist nicht im Bruttolohn oben enthalten.</p></div>
   ${days.map(d=>{const l=(byDay[d]||[]).sort((a,b)=>(a.start||'').localeCompare(b.start||''));const sum=l.reduce((a,e)=>a+hours(e),0);
     return `<div class="sec"><span>${dlbl(d)}${rbHead(d)}</span><span class="num">${l.length>1?fmt(sum)+' Std.':''}</span></div>${st.feiertage.includes(d)?holidayHtml(d):''}${l.map(entryHtml).join('')}`}).join('')||'<div class="empty">Keine Einträge in diesem Monat.</div>'}
  </div>`;
  M.querySelector('#back').onclick=()=>{monthOpen=null;render()};
  M.querySelector('#pdf').onclick=()=>window.print();
  M.querySelector('#csv').onclick=()=>downloadCsv(st.list,`Zeiterfassung_${monthOpen}.csv`);
  bindEntries();
}

// ---------- Ansicht: Auswertung ----------
function vAuswertung(){
  const s=DB.settings; const years=[...new Set(DB.entries.map(e=>e.date.slice(0,4)))].sort().reverse();
  let body='';
  if(tab==='ueber'||tab==='jahre'){
    // Saldo läuft Monat für Monat. Ist für ein Jahr ein Übertrag eingetragen (overtimeCarry), beginnt das Jahr mit diesem Wert statt mit dem errechneten Stand der Vorjahre.
    let bal=+s.overtimeStart||0; const rows=[]; const oc=s.overtimeCarry||{}; const op=s.overtimePayout||{}; const yi={}; let ly=''; // overtimePayout: ausbezahlte Überstunden je Monat ('JJJJ-MM': Std.), mindern den Saldo
    monthsWithData().slice().reverse().forEach(k=>{const[y,m]=k.split('-').map(Number);
      if(String(y)!==ly){ly=String(y);const set=oc[ly]!=null&&oc[ly]!=='';const calc=bal;if(set)bal=+oc[ly]||0;yi[ly]={start:bal,set,calc,end:bal,pay:0}}
      const st=monthStats(y,m-1);const pay=+op[k]||0;bal+=st.diff-pay;rows.push({k,st,bal,pay});yi[ly].end=bal;yi[ly].pay+=pay});
    rows.reverse(); const cur=rows[0]?rows[0].bal:0; const thisY=String(new Date().getFullYear());
    if(tab==='ueber') body=`<div class="card" style="text-align:center"><div class="muted">Überstunden-Saldo</div><div class="big num ${cur>=0?'pos':'neg'}" style="font-size:36px">${fmtS(cur)} Std.</div></div>`+
      [...new Set(rows.map(r=>r.k.slice(0,4)))].map(y=>{const rs=rows.filter(r=>r.k.startsWith(y)),i=yi[y],ch=i.end-i.start;
        return `<div class="sec"><span>${y}</span><span class="num">${y===thisY?'Stand heute':'Stand Jahresende'}: ${fmtS(i.end)} Std.</span></div>
        <div class="card"><table class="num"><tr><th>Monat</th><th class="r">Ausbezahlt</th><th class="r">Differenz</th><th class="r">Saldo</th></tr>
        <tr><td><b>${y===thisY?'Stand heute':'Stand Ende '+y}</b></td><td class="r"><b>${i.pay?fmt(i.pay):''}</b></td><td class="r ${ch>=0?'pos':'neg'}"><b>${fmtS(ch)}</b></td><td class="r"><b>${fmt(i.end)}</b></td></tr>

function applyTheme(){let t='';try{t=localStorage.getItem('zeit.theme')||''}catch(e){} if(t)document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme;}
applyTheme();

document.getElementById('fileIn').onchange=async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f)return;
  try{
    const d=JSON.parse(await f.text()); if(!Array.isArray(d.entries))throw new Error('Keine gültige Sicherung');
    if(!confirm(`Backup mit ${d.entries.length} Einträgen einspielen?\n\nAlle ${DB.entries.length} Einträge in der Datenbank werden dabei ersetzt.`))return;
    toast('Wird eingespielt…'); setSync('busy');
    const del=await sb.from('entries').delete().eq('user_id',USER.id); if(del.error) throw del.error;
    const rows=d.entries.map(e=>toRow({...e,id:e.id||uid()}));
    for(let i=0;i<rows.length;i+=500){const r=await sb.from('entries').insert(rows.slice(i,i+500)); if(r.error) throw r.error; toast(`Eingespielt: ${Math.min(i+500,rows.length)} / ${rows.length}`)}
    DB.settings={...DEFAULT_SETTINGS,...(d.settings||{})};
    const r=await sb.from('settings').upsert({user_id:USER.id,data:DB.settings,updated_at:new Date().toISOString()}); if(r.error) throw r.error;
    await fetchAll(); render(); toast(`Fertig: ${DB.entries.length} Einträge eingespielt`);
  }catch(e){setSync('err'); alert('Fehler beim Einspielen: '+(e.message||e)); refresh(true);}
};
function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function downloadCsv(list,name){
  const rows=[['Datum','Wochentag','Art','Beginn','Ende','Pause (Min.)','Stunden','Grund','Beschreibung']];
  list.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start||'')).forEach(e=>rows.push([e.date.split('-').reverse().join('.'),WD[parseIso(e.date).getDay()],e.type,e.start||'',e.end||'',e.pause||'',fmt(hours(e)),e.reason||'',e.note||'']));
  download('﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n'),name,'text/csv');
}

// ---------- Eintrag bearbeiten ----------
function editEntry(e){
  const s=DB.settings; const isNew=!e;
  e=e?{...e}:{id:uid(),date:selDate,type:'Arbeit',start:s.defaultStart,end:s.defaultEnd,pause:s.defaultPause,note:''};
  const origDate=e.date; let rb=rbOf(e.date); let ackPause=false;
  // Gesetzliche Pause (ArbZG § 4): mehr als 6 Std. Arbeit am Tag = 30 Min., mehr als 9 Std. = 45 Min.
  // Gezählt wird der ganze Tag: Pausen aller Arbeitseinträge plus Lücken zwischen ihnen. Nur Erinnerung, kein Zwang.
  const pauseCheck=b=>{const day=DB.entries.filter(x=>x.type==='Arbeit'&&x.date===b.date&&x.id!==b.id).concat([b]).map(x=>{let a=toMin(x.start),z=toMin(x.end);if(z<a)z+=1440;return{a,z,p:+x.pause||0}}).sort((p,q)=>p.a-q.a);
    let gross=0,own=0,gaps=0;day.forEach((x,i)=>{gross+=x.z-x.a;own+=x.p;if(i)gaps+=Math.max(0,x.a-day[i-1].z)});
    const work=gross-own,need=work>540?45:work>360?30:0,pause=own+gaps;
    return need&&pause<need?{work,need,pause,miss:need-pause,n:day.length}:null};
  const F=document.getElementById('dlgForm'), D=document.getElementById('dlg');
  const draw=()=>{
    const work=e.type==='Arbeit';
    F.innerHTML=`<h2>${isNew?'Neuer Eintrag':'Eintrag bearbeiten'}</h2>
    <div class="seg">${['Arbeit','Urlaub','Krankheit'].map(t=>`<button type="button" data-t="${t}" class="${e.type===t?'on':''}">${t}</button>`).join('')}</div>
    <div class="grid ${!work&&isNew?'g2':''}"><div><label for="f_date">${work||!isNew?'Datum':'Von'}</label><input type="date" id="f_date" value="${e.date}" required></div>
     ${!work&&isNew?`<div><label for="f_to">Bis</label><input type="date" id="f_to" value="${e._to||e.date}"></div>`:''}</div>
    ${work?`<div class="grid g3"><div><label for="f_start">Beginn</label><input type="time" id="f_start" value="${e.start}" required></div><div><label for="f_end">Ende</label><input type="time" id="f_end" value="${e.end}" required></div><div><label for="f_pause">Pause (Min.)</label><input type="number" inputmode="numeric" id="f_pause" min="0" step="5" value="${e.pause||0}"></div></div>`
     :`<div class="grid g2"><div><label for="f_hours">Stunden pro Tag</label><input type="number" inputmode="decimal" step="0.01" id="f_hours" value="${e.hours??s.dailySoll}"></div><div><label for="f_reason">Grund</label><input id="f_reason" value="${esc(e.reason||(e.type==='Urlaub'?'Ganzer Tag':''))}"></div></div>`}
    ${work?`<div role="group" aria-label="Rufbereitschaft an diesem Tag"><label>Rufbereitschaft an diesem Tag (höchstens eine Auswahl)</label>
     ${RB_KINDS.map(([k,l])=>`<label class="chk"><input type="checkbox" data-rb="${k}" ${rb===k?'checked':''}><span>${l}</span><span class="muted num" data-rbp="${k}"></span></label>`).join('')}</div>`:''}
    <div><label for="f_note">Beschreibung</label><textarea id="f_note" rows="3" maxlength="1000" style="resize:vertical" placeholder="Optional">${esc(e.note)}</textarea></div>
    <div class="calc num" id="f_sum"></div>
    <div id="f_warn" role="alert"></div>
    <div class="actions">${isNew?'<span></span>':'<button type="button" class="btn danger" id="f_del">Löschen</button>'}
     <span><button type="button" class="btn" id="f_cancel">Abbrechen</button><button class="btn pri" id="f_ok">Speichern</button></span></div>`;
    F.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{read();e.type=b.dataset.t;draw()});
    F.querySelector('#f_cancel').onclick=()=>D.close();
    const del=F.querySelector('#f_del'); if(del) del.onclick=()=>{if(confirm('Eintrag wirklich löschen?')){D.close();deleteEntry(e.id)}};
    // Nur eine der drei Rufbereitschafts-Arten kann gewählt sein; ein zweiter Klick auf die gewählte nimmt sie wieder heraus.
    F.querySelectorAll('[data-rb]').forEach(c=>c.onchange=()=>{rb=c.checked?c.dataset.rb:'';F.querySelectorAll('[data-rb]').forEach(o=>o.checked=o.dataset.rb===rb)});
    const upd=()=>{read();const el=F.querySelector('#f_sum');
      F.querySelectorAll('[data-rbp]').forEach(p=>p.textContent=eur(rbPrice(p.dataset.rbp,e.date)));
      if(e.type==='Arbeit'&&e.start&&e.end) el.textContent=`= ${fmt(hours(e))} Stunden`;
      else if(isNew&&e._to&&e._to>e.date){let n=0;for(let d=parseIso(e.date);iso(d)<=e._to;d.setDate(d.getDate()+1))if(isWorkday(d))n++;el.textContent=`${n} Arbeitstage werden eingetragen`}
      else el.textContent='';};
    F.querySelectorAll('input').forEach(i=>i.oninput=upd); upd();
  };
  const read=()=>{const v=id=>{const el=F.querySelector('#'+id);return el?el.value:undefined};
    e.date=v('f_date')||e.date; const n=v('f_note'); if(n!==undefined)e.note=n;
    if(e.type==='Arbeit'){e.start=v('f_start')||e.start||s.defaultStart;e.end=v('f_end')||e.end||s.defaultEnd;const p=v('f_pause');e.pause=parseInt(p!==undefined?p:(e.pause||0))||0;delete e.hours;delete e.reason}
    else{const h=v('f_hours');e.hours=parseFloat(h!==undefined?h:(e.hours??s.dailySoll));const r=v('f_reason');if(r!==undefined)e.reason=r;const t=v('f_to');if(t!==undefined)e._to=t}};
  F.onsubmit=ev=>{ev.preventDefault();read();
    const base={...e}; delete base._to;
    if(base.type==='Arbeit'&&(!base.start||!base.end)) return toast('Bitte Beginn und Ende angeben');
    const pw=base.type==='Arbeit'&&!ackPause?pauseCheck(base):null;
    if(pw){const W=F.querySelector('#f_warn');
      W.innerHTML=`<div class="warn"><b>Gesetzliche Pause beachten</b><br>An diesem Tag sind ${hmin(pw.work/60)} Stunden Arbeit eingetragen. Bei mehr als ${pw.need===45?9:6} Stunden sind ${pw.need} Minuten Pause vorgeschrieben, eingetragen sind ${pw.pause} Minuten${pw.n>1?' (Pausen und Lücken zwischen den Einträgen des Tages mitgezählt)':''}.
        <div class="warnbtn"><button type="button" class="btn small pri" id="w_fill">${pw.miss} Min. Pause eintragen</button><button type="button" class="btn small" id="w_skip">Ohne Pause speichern</button></div></div>`;
      W.querySelector('#w_fill').onclick=()=>{const p=F.querySelector('#f_pause');p.value=(parseInt(p.value)||0)+pw.miss;W.innerHTML='';p.dispatchEvent(new Event('input'));p.focus()};
      W.querySelector('#w_skip').onclick=()=>{ackPause=true;F.requestSubmit()};
      W.scrollIntoView({block:'nearest'}); return}
    if(base.type!=='Arbeit'){delete base.start;delete base.end;delete base.pause;if(isNaN(base.hours))base.hours=s.dailySoll}
    let changed=[];
    if(isNew&&e.type!=='Arbeit'&&e._to&&e._to>e.date){
      for(let d=parseIso(e.date);iso(d)<=e._to;d.setDate(d.getDate()+1)){ if(isWorkday(d)) changed.push({...base,id:uid(),date:iso(d)}); }
      if(!changed.length) return toast('Keine Arbeitstage im Zeitraum');
      DB.entries.push(...changed);
    } else { const i=DB.entries.findIndex(x=>x.id===base.id); if(i>=0)DB.entries[i]=base; else DB.entries.push(base); changed=[base]; }
    if(base.type==='Arbeit'){const o={...(s.rb||{})}; if(rb)o[base.date]=rb; else delete o[base.date];
      if(origDate!==base.date&&!DB.entries.some(x=>x.date===origDate)) delete o[origDate];
      if(JSON.stringify(o)!==JSON.stringify(s.rb||{})){s.rb=o;saveSettings()}}
    D.close(); selDate=base.date; render();
    saveEntries(changed).then(ok=>ok&&toast(changed.length>1?changed.length+' Einträge gespeichert':'Gespeichert'));
  };
  draw(); D.showModal();
}

// ---------- Passwort ----------
function passwordDialog(recovery){
  const F=document.getElementById('dlgForm'), D=document.getElementById('dlg');
  F.innerHTML=`<h2>${recovery?'Neues Passwort festlegen':'Passwort ändern'}</h2>
   <div class="grid"><div><label for="p1">Neues Passwort</label><input type="password" id="p1" minlength="8" autocomplete="new-password" required></div>
   <div><label for="p2">Wiederholen</label><input type="password" id="p2" minlength="8" autocomplete="new-password" required></div></div>
   <div class="calc" id="pmsg" style="color:var(--mut);font-weight:500;font-size:13px">Mindestens 8 Zeichen.</div>
   <div class="actions"><span></span><span><button type="button" class="btn" id="pc">Abbrechen</button><button class="btn pri">Speichern</button></span></div>`;
  F.querySelector('#pc').onclick=()=>D.close();
  F.onsubmit=async ev=>{ev.preventDefault();const a=F.querySelector('#p1').value,b=F.querySelector('#p2').value;
    if(a!==b) return F.querySelector('#pmsg').textContent='Die Passwörter stimmen nicht überein.';
    const {error}=await sb.auth.updateUser({password:a});
    if(error) return F.querySelector('#pmsg').textContent='Fehler: '+error.message;
    D.close(); toast('Passwort geändert');};
  D.showModal();
}

// ---------- Anmeldung ----------
function vLogin(msg=''){
  M=null;
  R.innerHTML=`<div class="login"><div class="box"><img src="icon.svg" alt=""><h1>Zeiterfassung</h1><p class="muted">Bitte anmelden</p>
   <form class="card" id="lf"><div class="grid"><div><label for="le">E-Mail</label><input type="email" id="le" autocomplete="username" required></div>
   <div><label for="lp">Passwort</label><input type="password" id="lp" autocomplete="current-password" required></div></div>
   <button class="btn pri" style="width:100%;min-height:46px">Anmelden</button>
   <div style="text-align:center;margin-top:8px"><button type="button" class="linkbtn" id="forgot">Passwort vergessen?</button></div>
   <div class="msg" id="lm">${esc(msg)}</div></form></div></div>`;
  const lm=document.getElementById('lm');
  document.getElementById('lf').onsubmit=async ev=>{ev.preventDefault();lm.className='msg';lm.textContent='Anmeldung…';
    const {error}=await sb.auth.signInWithPassword({email:document.getElementById('le').value.trim(),password:document.getElementById('lp').value});
    if(error){lm.className='msg err';lm.textContent=/invalid/i.test(error.message)?'E-Mail oder Passwort falsch.':error.message;}};
  document.getElementById('forgot').onclick=async()=>{const em=document.getElementById('le').value.trim();
    if(!em){lm.className='msg err';lm.textContent='Bitte zuerst die E-Mail-Adresse eintragen.';return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    lm.className=error?'msg err':'msg';lm.textContent=error?error.message:'Falls ein Konto existiert, wurde eine E-Mail zum Zurücksetzen verschickt.';};
}
let booted=null;
async function boot(user){
  if(booted===user.id) return; booted=user.id; USER=user;
  const had=cacheLoad(); shell(); render();
  if(!had) M.innerHTML=topBar('Zeiterfassung')+'<div class="wrap"><div class="empty">Daten werden geladen…</div></div>';
  await refresh(false);
}
sb.auth.onAuthStateChange((event,session)=>{
  setTimeout(()=>{ // außerhalb des Auth-Callbacks weiterarbeiten
    if(event==='PASSWORD_RECOVERY'&&session){boot(session.user).then(()=>passwordDialog(true));return}
    if(session&&session.user) boot(session.user);
    else if(event!=='TOKEN_REFRESHED'){booted=null;USER=null;M=null;DB={settings:{...DEFAULT_SETTINGS},entries:[]};vLogin();}
  },0);
});
// Beim Zurückkehren zur App (z. B. am Handy) Änderungen vom anderen Gerät holen
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&USER&&Date.now()-lastFetch>30000&&!document.getElementById('dlg').open)refresh(true)});
</script>
