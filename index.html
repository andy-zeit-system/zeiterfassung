<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Sicherheit: erlaubt nur eigene Dateien, die Supabase-Bibliothek von jsdelivr und Verbindungen zur eigenen Supabase-Datenbank -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://qtidstkbbnddllkpthpb.supabase.co wss://qtidstkbbnddllkpthpb.supabase.co; manifest-src 'self'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zeiten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Zeiterfassung</title>
<style>
:root{
  --bg:#f3f5f7;--surface:#fff;--surface2:#eef1f4;--line:#e1e6ea;--txt:#16202a;--mut:#687583;
  --acc:#0f766e;--acc-ink:#fff;--acc-soft:#e3f3f1;
  --work:#0f766e;--vac:#d97706;--vac-txt:#b45309;--sick:#dc2626;--hol:#7c3aed;--pos:#15803d;--neg:#c2410c;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1215;--surface:#161b1f;--surface2:#1d2429;--line:#283137;--txt:#e7ecef;--mut:#94a1ab;
  --acc:#2dd4bf;--acc-ink:#062b27;--acc-soft:#123430;
  --work:#2dd4bf;--vac:#fbbf24;--sick:#f87171;--on-sick:#0e1215;--vac-txt:#fbbf24;--hol:#a78bfa;--pos:#4ade80;--neg:#fb923c;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0e1215;--surface:#161b1f;--surface2:#1d2429;--line:#283137;--txt:#e7ecef;--mut:#94a1ab;
  --acc:#2dd4bf;--acc-ink:#062b27;--acc-soft:#123430;
  --work:#2dd4bf;--vac:#fbbf24;--sick:#f87171;--on-sick:#0e1215;--vac-txt:#fbbf24;--hol:#a78bfa;--pos:#4ade80;--neg:#fb923c;--shadow:none;}
*{box-sizing:border-box}
body{background:transparent!important} /* Hintergrund liegt auf <html>, damit die Deko dahinter sichtbar ist */
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--txt);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.lblrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:5px}.lblrow label{margin:0}
.mic{display:inline-flex;align-items:center;gap:6px}.mic.on{background:var(--neg);border-color:transparent;color:#fff}
input.plain{border-color:transparent;background:transparent;padding:2px 0;min-height:28px;text-align:right;-moz-appearance:textfield;appearance:textfield;cursor:text}
input.plain::-webkit-outer-spin-button,input.plain::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.warn{border:1px solid var(--neg);border-radius:10px;padding:10px 12px;margin:10px 0 16px;font-size:14px;line-height:1.5}
.warnbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--txt);margin:0;padding:7px 0;cursor:pointer}
.chk input{width:20px;min-height:20px;height:20px;padding:0;flex:none;accent-color:var(--acc)}
.chk .muted{margin-left:auto;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.hidden{display:none!important}

/* Layout */
.app{display:flex;min-height:100vh}
nav.side{width:232px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 10px 18px}
.brand img{width:32px;height:32px;border-radius:9px}
nav.side button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mut);font-weight:500;text-align:left}
nav.side button svg{width:20px;height:20px;flex-shrink:0}
nav.side button:hover{background:var(--surface2);color:var(--txt)}
nav.side button.on{background:var(--acc-soft);color:var(--acc)}
nav.side .who{margin-top:auto;font-size:12px;color:var(--mut);padding:10px 12px;overflow-wrap:anywhere}
main{flex:1;min-width:0;padding-bottom:40px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px max(24px,calc((100% - 760px)/2 + 24px)) 12px;display:flex;align-items:center;gap:8px;min-height:64px}
.top h1{font-size:22px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-size:13px;color:var(--mut);font-weight:500}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--pos);flex-shrink:0;margin-left:4px}
.sync.busy{background:var(--vac);animation:pulse 1s infinite}
.top{flex-wrap:wrap}
.sync.wait{order:9;flex-basis:100%;width:auto;height:auto;min-height:44px;margin:4px 0 0;border-radius:10px;background:var(--sick);color:var(--on-sick,#fff);font-size:14px;font-weight:700;padding:8px 14px;border:0;text-align:left;cursor:pointer}
.sync.wait:focus-visible{outline:2px solid var(--txt);outline-offset:2px}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Jahreszeiten-Deko: schwebt hinter den Karten (z-index -1), das Tier sitzt unten links. Bei "weniger Bewegung" steht alles still. */
#deco .bit{position:fixed;top:-8vh;z-index:-1;pointer-events:none;opacity:.75;animation:deco-fall linear infinite}
#deco .bit i{display:block;animation:deco-sway ease-in-out infinite alternate}
#deco svg{display:block;width:100%;height:auto}
@keyframes deco-fall{to{transform:translate3d(0,118vh,0)}}
@keyframes deco-rise{to{transform:translate3d(0,-118vh,0)}}
@keyframes deco-sway{from{transform:translateX(-14px) rotate(-24deg)}to{transform:translateX(14px) rotate(24deg)}}
@keyframes deco-flap{to{transform:scaleX(.4)}}
.deco.winter .bit i{animation-name:none}
.deco.sommer .bit{top:auto;bottom:-8vh;animation-name:deco-rise}
.deco.sommer .wings{transform-origin:12px 12px;animation:deco-flap .32s ease-in-out infinite alternate}
#deco .ground{position:fixed;left:0;right:0;bottom:0;height:0;z-index:-1;pointer-events:none}
#deco .tuft{position:absolute;bottom:-2px;transform-origin:50% 100%;animation:deco-wind ease-in-out infinite alternate}
@keyframes deco-wind{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
#deco .pet{position:fixed;left:24px;bottom:52px;width:58px;z-index:3;pointer-events:none}
#deco .pet svg{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.deco.herbst .pet{animation:pet-trippel 6s ease-in-out infinite}
.deco.winter .pet{width:42px;transform-origin:50% 100%;animation:pet-waddle 1.4s ease-in-out infinite alternate}
.deco.fruehling .pet{width:46px;animation:pet-hop 3.4s ease-in-out infinite}
.deco.sommer .pet{width:66px;animation:pet-jump 4.5s ease-in-out infinite}
@keyframes pet-trippel{0%,100%{transform:translateX(0)}45%,55%{transform:translateX(34px)}}
@keyframes pet-waddle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes pet-hop{0%,58%,100%{transform:translateY(0)}70%{transform:translateY(-13px)}82%{transform:translateY(0)}90%{transform:translateY(-5px)}}
@keyframes pet-jump{0%,100%{transform:translateY(6px) rotate(9deg)}50%{transform:translateY(-12px) rotate(-11deg)}}

/* Ottocento: Papier und Tinte, Serifenschrift, doppelte Rahmenlinien */
:root[data-style="ottocento"]{--r:5px;--shadow:none;background-image:radial-gradient(120% 80% at 10% 0%,rgba(150,110,50,.10),transparent 55%),radial-gradient(90% 70% at 100% 100%,rgba(120,80,30,.10),transparent 60%);background-attachment:fixed}
:root[data-style="ottocento"] body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;font-size:15.5px}
:root[data-style="ottocento"] h1,:root[data-style="ottocento"] .brand{font-variant-caps:small-caps;letter-spacing:.03em;font-weight:600}
:root[data-style="ottocento"] .card,:root[data-style="ottocento"] .today,:root[data-style="ottocento"] .lscroll,:root[data-style="ottocento"] .mcard{box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px var(--line)}
:root[data-style="ottocento"] .btn,:root[data-style="ottocento"] input,:root[data-style="ottocento"] select,:root[data-style="ottocento"] textarea{border-radius:4px}
:root[data-style="ottocento"] .sec{border-bottom:3px double var(--line);padding-bottom:4px}
:root[data-style="ottocento"] th{letter-spacing:.08em}
:root[data-style="ottocento"] .brand img{filter:sepia(1) saturate(2.2) hue-rotate(-28deg) brightness(.8)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px;background:var(--surface);border:1px solid var(--line);color:var(--txt);white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{color:var(--sick)}
.btn.small{min-height:34px;padding:5px 11px;font-size:13.5px}
.ibtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--txt);flex-shrink:0}
.ibtn:hover{background:var(--surface2)}
.ibtn svg{width:20px;height:20px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--acc);color:var(--acc-ink);display:none;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:8}
.fab svg{width:26px;height:26px}

/* Karten */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px}
.sec{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 4px 8px;display:flex;justify-content:space-between;gap:8px}

/* Woche */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
/* Heute-Leiste: Status von heute + Monat bis heute */
.today{margin:0 0 18px;padding:14px 16px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.today p{margin:0}
.t-line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;min-height:36px}
.t-line b{font-weight:700}
.t-line .btn{min-height:44px}
.mbar{position:relative;height:10px;margin:12px 0 8px;border-radius:999px;background:var(--surface2);overflow:visible}
.mbar .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--work)}
.mbar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--txt)}
.m-line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:13px;color:var(--mut)}
.m-line b{color:var(--txt);font-weight:600}
.m-state{font-weight:700}
.m-state.ok,.m-state.ahead{color:var(--pos)}.behind{color:var(--vac-txt)}
.m-sub{margin-top:2px!important;font-size:12px;color:var(--mut)}
.m-sub i{display:inline-block;width:2px;height:10px;margin:0 6px -1px 0;background:var(--txt);border-radius:1px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.day .wd{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase}
.day .dn{font-size:18px;font-weight:700}
.day .dh{font-size:11px;color:var(--mut);min-height:16px}
.day.sun .wd{color:var(--sick)}
.day.hol .wd{color:var(--hol)}
.day.today{border-color:var(--acc);border-width:2px;padding:7px 0 6px}
.day.sel{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.day.sel .wd,.day.sel .dh{color:var(--acc-ink);opacity:.85}
.weeksum{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:2px 4px 0}

/* Einträge */
.entry{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);width:100%;text-align:left}
.entry:hover{border-color:var(--mut)}
.entry .stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--work);flex-shrink:0}
.entry.Urlaub .stripe{background:var(--vac)}.entry.Krankheit .stripe{background:var(--sick)}.entry.Feiertag .stripe{background:var(--hol)}
.entry.Feiertag{cursor:default}.entry.Feiertag:hover{border-color:var(--line)}
.entry .body{flex:1;min-width:0}
.entry .t{font-weight:600}
.entry .s{font-size:13px;color:var(--mut)}
.entry .tag{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;border:1px solid var(--hol);color:var(--hol);margin-left:6px;vertical-align:1px}
.entry .note{font-size:13.5px;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}
.entry .h{font-weight:700;font-size:16px;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:32px 12px;border:1.5px dashed var(--line);border-radius:var(--r)}

/* Monate */
.mcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.mcard:hover{border-color:var(--mut)}
.mcard .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mcard .row1 b{font-size:16px}
.mcard .row2{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:8px}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface2);border-radius:12px;padding:12px 6px;text-align:center}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse;font-size:14px}
/* Liste: alle Einträge als Tabelle, am PC breiter */
.wide .wrap{max-width:1240px}
.wide .top{padding-left:max(24px,calc((100% - 1240px)/2 + 24px));padding-right:max(24px,calc((100% - 1240px)/2 + 24px))}
.lfilter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 12px}
.lfilter label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
.lsum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mut);margin:0 0 10px}
.lsum b{color:var(--txt)}
.lscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.ltab{min-width:540px;font-size:14px}
.ltab td.num{white-space:nowrap}
.ltab thead th{position:sticky;top:0;background:var(--surface);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.ltab th button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;padding:0;cursor:pointer}
.ltab td{padding:9px 10px;vertical-align:top}
.ltab tbody tr{cursor:pointer}
.ltab tbody tr:hover td{background:var(--surface2)}
.ltab tbody tr:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.ltab tr.newday td{border-top:2px solid var(--line)}
.ltab td.note{white-space:normal;min-width:160px;overflow-wrap:anywhere;color:var(--txt)}
.ltab td.muted{color:var(--mut)}
.ltab .art{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.ltab .art i{width:8px;height:8px;border-radius:50%;background:var(--work)}
.ltab .art.Urlaub i{background:var(--vac)}.ltab .art.Krankheit i{background:var(--sick)}
.ltab tfoot td{border-top:2px solid var(--line);font-weight:700}
.ltab tr.lweek td{background:var(--surface2);font-size:12px;font-weight:700;letter-spacing:.03em;padding:6px 10px;border-top:1px solid var(--line)}
.ltab tr.lweek .muted{font-weight:500;color:var(--mut)}
.ltab td.sf{color:var(--sick);font-weight:600}
.ltab .hol-n{font-size:12px;font-weight:600;color:var(--hol);white-space:nowrap}
.ltab mark{background:var(--acc-soft);color:var(--txt);border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--acc)}
.ltab .d-short,.ltab .rb-m,.ltab .t-m,.ltab .u-m{display:none}
.ltab .rb-m{color:var(--mut)}
th{font-size:11px;color:var(--mut);text-align:left;font-weight:600;padding:6px 4px;text-transform:uppercase;letter-spacing:.04em}
td{padding:8px 4px;border-top:1px solid var(--line)}
.show-m{display:none}
.rbt td:last-child{white-space:nowrap}
.rbcard{overflow-x:auto}
td.r,th.r{text-align:right}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--txt);box-shadow:var(--shadow)}

/* Einstellungen */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:54px}
.list>div:first-child{border-top:0}
.list input,.list select{width:160px;text-align:right}
.list .wide{flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;min-width:42px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.vac{background:linear-gradient(135deg,color-mix(in srgb,var(--vac) 20%,var(--surface)),var(--surface))}

/* Dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--txt);border-radius:20px;width:min(480px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,10,15,.5)}
dialog form{padding:20px;overflow:auto;max-height:92vh}
dialog h2{margin:0 0 16px;font-size:19px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:16px}
.seg button{padding:9px;border-radius:9px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--surface);color:var(--txt);box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:5px}
.calc{font-size:15px;font-weight:600;color:var(--acc);min-height:22px;margin:6px 0 14px}
.actions{display:flex;gap:8px;justify-content:space-between;align-items:center}
.actions span{display:flex;gap:8px}

/* Anmeldung */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .box{width:min(380px,100%)}
.login img{width:60px;height:60px;border-radius:16px;display:block;margin:0 auto 14px}
.login h1{text-align:center;font-size:24px;margin:0 0 4px}
.login p{text-align:center;margin:0 0 22px}
.login .card{padding:20px}
.linkbtn{color:var(--acc);font-weight:600;font-size:14px;padding:6px 0}
.msg{font-size:14px;margin-top:8px;text-align:center;min-height:20px}
.msg.err{color:var(--sick)}

  const feiertage=[];
  for(let d=new Date(y,m,1);d.getMonth()===m;d.setDate(d.getDate()+1)){
    const s=iso(d); if((st&&s<st)||!DB.settings.workdays.includes(d.getDay())) continue;
    soll+=ds;
    // Feiertag auf Arbeitstag ohne Eintrag: freier Tag. Nur wenn in den Einstellungen so gewählt, wird er bezahlt gutgeschrieben (Feiertagslohn).
    if(isHoliday(s) && !list.some(e=>e.date===s)){ if(DB.settings.holidayPaid) add('Feiertagslohn',ds,s); feiertage.push(s); }
  }
  // Festes Monats-Soll (z. B. 130 Std. laut Vertrag) ersetzt das nach Arbeitstagen gezählte Soll; Monate vor dem Startdatum haben kein Soll.
  if(+DB.settings.monthlySoll>0) soll=(st&&to<st)?0:+DB.settings.monthlySoll;
  const KIND={Arbeit:'Zeitlohn',Urlaub:'Urlaubslohn',Krankheit:'Krankheitslohn'};
  list.forEach(e=>add(KIND[e.type],hours(e),e.date));
  const r2=n=>Math.round(n*100)/100;
  const rows=Object.entries(lohn).map(([k,h])=>{const[name,rate]=k.split('|');return{name,rate:+rate,h:r2(h),betrag:r2(r2(h)*rate)}})
    .sort((a,b)=>LOHN_ORDER.indexOf(a.name)-LOHN_ORDER.indexOf(b.name)||a.rate-b.rate);
  const ist=rows.reduce((a,r)=>a+r.h,0);
  // Gearbeitete Stunden an Sonn- und Feiertagen (Grundlage für den Zuschlag), je Tag zusammengefasst
  const sfMap={}; list.forEach(e=>{if(e.type==='Arbeit'&&sfName(e.date))sfMap[e.date]=(sfMap[e.date]||0)+hours(e)});
  const sfTage=Object.keys(sfMap).sort().map(d=>({date:d,name:sfName(d),h:r2(sfMap[d])}));
  return {list,rows,feiertage,sfTage,sfStd:r2(sfTage.reduce((a,t)=>a+t.h,0)),soll:r2(soll),ist:r2(ist),diff:r2(ist-soll),brutto:r2(rows.reduce((a,r)=>a+r.betrag,0)),
    urlaub:new Set(list.filter(e=>e.type==='Urlaub').map(e=>e.date)).size,krank:new Set(list.filter(e=>e.type==='Krankheit').map(e=>e.date)).size};
}

// ---------- Heute-Leiste ----------
// Zeigt nur an, rechnet nichts Neues: Ist und Soll kommen aus monthStats.
// "Bis heute fällig" = Monats-Soll anteilig nach Soll-Tagen (gleiche Tage wie in monthStats) bis einschließlich heute.
// Ist bis heute = Einträge bis heute (+ Feiertagslohn bis heute, falls eingestellt). Spätere, z. B. geplanter Urlaub, zählen noch nicht.
const PLAN_TOLERANCE_H=0.5;
function monthToDate(now=new Date()){
  const y=now.getFullYear(), m=now.getMonth(), today=iso(now), st=DB.settings, ms=monthStats(y,m);
  let all=0, past=0;
  for(let d=new Date(y,m,1);d.getMonth()===m;d.setDate(d.getDate()+1)){const s=iso(d);
    if((st.startDate&&s<st.startDate)||!st.workdays.includes(d.getDay())) continue; all++; if(s<=today) past++}
  const due=all?ms.soll*past/all:0;
  const ist=ms.list.filter(e=>e.date<=today).reduce((a,e)=>a+hours(e),0)+(st.holidayPaid?ms.feiertage.filter(d=>d<=today).length*st.dailySoll:0);
  return {y,m,soll:ms.soll,due,ist,diff:ist-due};
}
function todayHtml(){
  const now=new Date(), t=iso(now), st=DB.settings;
  const list=DB.entries.filter(e=>e.date===t), h=list.reduce((a,e)=>a+hours(e),0);
  const free=!st.workdays.includes(now.getDay())||!!isHoliday(t);
  const status=list.length?`<b class="num">${fmt(h)} Std.</b> eingetragen`:free?`frei${isHoliday(t)?' · '+esc(isHoliday(t)):''}`:'noch nichts eingetragen';
  const jump=selDate!==t&&!list.length&&!free?`<button class="btn small" id="t_go">Heute eintragen</button>`:'';
  const k=monthToDate(now);
  if(!(k.soll>0)) return `<section class="today" aria-label="Heute"><p class="t-line"><span>Heute: ${status}</span>${jump}</p></section>`;
  const max=Math.max(k.soll,k.ist), pct=v=>Math.min(100,v/max*100).toFixed(1);
  const state=Math.abs(k.diff)<PLAN_TOLERANCE_H?['ok','im Plan']:k.diff>0?['ahead',`${fmt(k.diff,1)} Std. voraus`]:['behind',`${fmt(-k.diff,1)} Std. offen`];
  const aria=`${MON[k.m]}: ${fmt(k.ist,1)} von ${fmt(k.soll,1)} Stunden, bis heute fällig ${fmt(k.due,1)}, ${state[1]}`;
  return `<section class="today" aria-label="Heute">
    <p class="t-line"><span>Heute: ${status}</span>${jump}</p>
    <div class="mbar" role="img" aria-label="${aria}"><span class="fill" style="width:${pct(k.ist)}%"></span><span class="mark" style="left:${pct(k.due)}%"></span></div>
    <p class="m-line"><span>${MON[k.m]}: <b class="num">${fmt(k.ist,1)}</b> von <span class="num">${fmt(k.soll,1)}</span> Std.</span><span class="m-state ${state[0]==='behind'?'behind':state[0]}">${state[1]}</span></p>
    <p class="m-sub"><i aria-hidden="true"></i>bis heute fällig: <span class="num">${fmt(k.due,1)}</span> Std.</p>
  </section>`;
}

  const kw=(d=>{d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y)/864e5+1)/7)})(sd);
  const today=iso(new Date()), a=iso(days[0]), b=iso(days[6]);

    <div class="sec"><span>${dlong(selDate)}${hol?' · '+esc(hol):''}${rbHead(selDate)}</span><span class="num">${list.length?fmt(sum)+' Std.':''}</span></div>

   </div>`;
  M.querySelectorAll('.day').forEach(el=>el.onclick=()=>{selDate=el.dataset.d;render()});

// ---------- Ansicht: Liste ----------
// Alle Einträge als Tabelle mit allen Spalten. Zeitraum-Schnellwahl, Filter nach Art, Suche mit Treffer-Markierung,
// Zwischensummen je Kalenderwoche, Summen für die Auswahl. Am Handy fallen Nebenspalten weg (kein seitliches Scrollen).
// Beim Tippen in die Suche wird nur der Tabelleninhalt neu gezeichnet (Fokus bleibt im Feld).
let LF={r:'m:'+iso(new Date()).slice(0,7),t:'',q:'',dir:-1};
const RB_SHORT={ueb:'übernommen',voll:'ja',abg:'abgegeben'};
const isoWeek=d=>{d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return {kw:Math.ceil(((d-y)/864e5+1)/7),year:d.getUTCFullYear()}};
const weekStart=d=>{const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));return m};
function listRange(){ // [von, bis] als ISO-Datum; leer = offen
  const now=new Date(), [k,v]=LF.r.split(':');
  if(k==='w'){const a=weekStart(now), b=new Date(a);b.setDate(a.getDate()+6);return [iso(a),iso(b)]}
  if(k==='m'){const[y,m]=v.split('-').map(Number);return [iso(new Date(y,m-1,1)),iso(new Date(y,m,0))]}
  if(k==='y') return [v+'-01-01',v+'-12-31'];
  return ['',''];
}
function listFiltered(){
  const q=LF.q.trim().toLowerCase(), [a,b]=listRange();
  return DB.entries.filter(e=>(!a||e.date>=a)&&(!b||e.date<=b)&&(!LF.t||e.type===LF.t)
      &&(!q||[e.note,e.reason,e.type,dlbl(e.date)].some(v=>String(v||'').toLowerCase().includes(q))))
    .sort((x,y)=>LF.dir*x.date.localeCompare(y.date)||(x.start||'').localeCompare(y.start||'')); // Tage nach Wahl, innerhalb des Tages früh -> spät
}
// Suchtreffer hervorheben (auf bereits maskiertem Text, Suchtext ebenfalls maskiert)
function hl(text){
  const t=esc(text), q=esc(LF.q.trim()); if(!q) return t;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  return t.replace(re,m=>`<mark>${m}</mark>`);
}
function listBody(){
  const list=listFiltered(); let prevDay='', prevWeek='';
  const weekSum={}; list.forEach(e=>{const w=isoWeek(parseIso(e.date));const k=w.year+'-'+w.kw;weekSum[k]=(weekSum[k]||0)+hours(e)});
  const rows=list.map(e=>{
    const d=parseIso(e.date), w=isoWeek(d), wk=w.year+'-'+w.kw, first=e.date!==prevDay, work=e.type==='Arbeit', sf=sfName(e.date);
    let head='';
    if(wk!==prevWeek){const a=weekStart(d), b=new Date(a);b.setDate(a.getDate()+6);
      head=`<tr class="lweek"><td colspan="4">KW ${w.kw} <span class="muted">· ${a.getDate()}.${a.getMonth()+1}.–${b.getDate()}.${b.getMonth()+1}.</span></td><td class="c-tag"></td><td class="c-pause"></td><td class="num r">${fmt(weekSum[wk])}<span class="u-m"> Std.</span></td><td colspan="2" class="c-x"></td></tr>`}
    prevDay=e.date; prevWeek=wk; const rb=first?rbOf(e.date):'';
    return head+`<tr tabindex="0" data-id="${esc(e.id)}" class="${first?'newday':''}">
      <td class="num">${first?`<span class="d-full">${dlbl(e.date).slice(5)}</span><span class="d-short">${WD[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth()+1)}.</span>`:''}</td>
      <td class="c-tag ${sf?'sf':'muted'}" ${sf?`title="${esc(sf)}"`:''}>${first?WD[d.getDay()]:''}</td>
      <td><span class="art ${e.type}"><i aria-hidden="true"></i><span class="art-l">${e.type}</span></span></td>
      <td class="num">${work?e.start:`<span class="t-m">${e.type}</span>`}</td><td class="num">${work?e.end:''}</td><td class="num r c-pause">${work&&e.pause?e.pause+' Min.':''}</td>
      <td class="num r"><b>${fmt(hours(e))}</b></td>

  const days=t=>new Set(list.filter(e=>e.type===t).map(e=>e.date)).size;

    sum:`<span>Summe <b class="num">${fmt(sum)} Std.</b></span><span>Arbeitstage <b class="num">${days('Arbeit')}</b></span><span>Urlaub <b class="num">${days('Urlaub')}</b></span><span>Krank <b class="num">${days('Krankheit')}</b></span>${rbDays?`<span>Rufbereitschaft <b class="num">${rbDays}</b></span>`:''}`};
}

// ---------- Ansicht: Auswertung ----------
function vAuswertung(){
  const s=DB.settings; const years=[...new Set(DB.entries.map(e=>e.date.slice(0,4)))].sort().reverse();
  let body='';
  if(tab==='ueber'||tab==='jahre'){
    // Saldo läuft Monat für Monat. Ist für ein Jahr ein Übertrag eingetragen (overtimeCarry), beginnt das Jahr mit diesem Wert statt mit dem errechneten Stand der Vorjahre.
    let bal=+s.overtimeStart||0; const rows=[]; const oc=s.overtimeCarry||{}; const op=s.overtimePayout||{}; const yi={}; let ly=''; // overtimePayout: ausbezahlte Überstunden je Monat ('JJJJ-MM': Std.), mindern den Saldo
    // Der laufende Monat (und spätere) zählt erst nach Monatsende mit, wie in Excel und im Firmennachweis (Vorgabe vom 11.11.2026).
    const nowK=iso(new Date()).slice(0,7);
    monthsWithData().slice().reverse().forEach(k=>{const[y,m]=k.split('-').map(Number);
      if(String(y)!==ly){ly=String(y);const set=oc[ly]!=null&&oc[ly]!=='';const calc=bal;if(set)bal=+oc[ly]||0;yi[ly]={start:bal,set,calc,end:bal,pay:0}}
      const st=monthStats(y,m-1);const pay=+op[k]||0;const open=k>=nowK;if(!open)bal+=st.diff-pay;rows.push({k,st,bal,pay,open});yi[ly].end=bal;yi[ly].pay+=pay});
    rows.reverse(); const cur=rows[0]?rows[0].bal:0; const thisY=String(new Date().getFullYear());
    if(tab==='ueber') body=`<div class="card" style="text-align:center"><div class="muted">Überstunden-Saldo</div><div class="big num ${cur>=0?'pos':'neg'}" style="font-size:36px">${fmtS(cur)} Std.</div></div>`+
      [...new Set(rows.map(r=>r.k.slice(0,4)))].map(y=>{const rs=rows.filter(r=>r.k.startsWith(y)),i=yi[y],ch=i.end-i.start;
        return `<div class="sec"><span>${y}</span><span class="num">${y===thisY?'Stand heute':'Stand Jahresende'}: ${fmtS(i.end)} Std.</span></div>
        <div class="card"><table class="num"><tr><th>Monat</th><th class="r">Ausbezahlt</th><th class="r">Differenz</th><th class="r">Saldo</th></tr>
        <tr><td><b>${y===thisY?'Stand heute':'Stand Ende '+y}</b></td><td class="r"><b>${i.pay?fmt(i.pay):''}</b></td><td class="r ${ch>=0?'pos':'neg'}"><b>${fmtS(ch)}</b></td><td class="r"><b>${fmt(i.end)}</b></td></tr>
        ${rs.map(r=>{const d=r.st.diff-r.pay;return `<tr${r.open?' class="muted"':''}><td>${MON[r.k.slice(5)-1]}${r.open?' <span style="font-size:12px">(läuft)</span>':''}</td><td class="r"><input type="number" step="0.01" min="0" data-pay="${r.k}" value="${r.pay||''}" aria-label="Ausbezahlte Überstunden ${MON[r.k.slice(5)-1]} ${y}" class="plain" style="width:64px"></td><td class="r ${r.open?'':d>=0?'pos':'neg'}">${fmtS(d)}</td><td class="r">${r.open?'–':fmt(r.bal)}</td></tr>`}).join('')}
        <tr><td>Übertrag aus ${y-1}</td><td></td><td class="r muted">${i.set?'eingetragen':'errechnet'}</td><td class="r"><input type="number" step="0.01" data-ocarry="${y}" value="${i.set?oc[y]:''}" placeholder="${Math.round(i.calc*100)/100}" style="width:88px;min-height:28px;padding:2px 6px;text-align:right"></td></tr></table>
        <p class="muted" style="font-size:12.5px;margin:10px 0 0">Differenz = Ist − Soll − ausbezahlte Überstunden. Die Auszahlung je Monat eintragen, sobald sie auf der Lohnabrechnung steht.<br>Der laufende Monat zählt erst nach Monatsende mit; seine Differenz ist nur ein Zwischenstand.<br>Übertrag leer lassen: Das Jahr beginnt mit dem errechneten Stand der Vorjahre.</p></div>`}).join('');
    else body=years.map(y=>{const rs=rows.filter(r=>r.k.startsWith(y)).reverse();const ist=rs.reduce((a,r)=>a+r.st.ist,0),soll=rs.reduce((a,r)=>a+r.st.soll,0),br=rs.reduce((a,r)=>a+r.st.brutto,0);const max=Math.max(...rs.map(r=>Math.max(r.st.ist,r.st.soll)),1);
      return `<div class="sec"><span>${y}</span></div><div class="card"><div class="kpis num"><div class="kpi"><div class="l">Ist</div><div class="v">${fmt(ist,0)}</div></div><div class="kpi"><div class="l">Soll</div><div class="v">${fmt(soll,0)}</div></div><div class="kpi"><div class="l">Brutto</div><div class="v" style="font-size:16px;padding-top:5px">${eur(br)}</div></div></div>
      <table class="num" style="margin-top:12px">${rs.map(r=>`<tr><td style="width:46px">${MON[r.k.slice(5)-1].slice(0,3)}</td><td><div class="bar" style="margin:0"><i style="width:${r.st.ist/max*100}%"></i></div></td><td class="r" style="width:64px">${fmt(r.st.ist,1)}</td></tr>`).join('')}</table></div>`}).join('');
  } else if(tab==='rb'){
    // Rufbereitschaft: je Jahr ein Block, je Monat Anzahl nach Art und Betrag
    const ys=[...new Set([String(new Date().getFullYear()),...Object.keys(s.rb||{}).filter(rbOf).map(d=>d.slice(0,4))])].sort().reverse();
    // „davon So/F.“ zählt alle drei Arten an Sonn- und Feiertagen; diese Tage stehen zusätzlich in ihrer Art-Spalte.
    const cnt=l=>({ueb:l.filter(t=>t.kind==='ueb').length,voll:l.filter(t=>t.kind==='voll').length,sf:l.filter(t=>sfName(t.date)).length,abg:l.filter(t=>t.kind==='abg').length,eur:l.reduce((a,t)=>a+t.eur,0)});
    const tr=(name,c,b)=>`<tr><td>${b?'<b>':''}${name}${b?'</b>':''}</td>${[c.ueb,c.voll,c.abg,c.sf].map(v=>`<td class="r">${v||''}</td>`).join('')}<td class="r">${b?'<b>':''}${eur(c.eur)}${b?'</b>':''}</td></tr>`;
    body=ys.map(y=>{const ms=[...Array(12)].map((_,m)=>({m,l:rbMonth(+y,m)})).filter(x=>x.l.length).reverse();const all=ms.flatMap(x=>x.l);
      return `<div class="sec"><span>${y}</span><span class="num">${all.length} ${all.length===1?'Tag':'Tage'} · ${eur(cnt(all).eur)}</span></div>
      <div class="card rbcard">${ms.length?`<table class="num rbt"><tr><th>Monat</th><th class="r"><span class="hide-m">Übern.</span><span class="show-m">Üb.</span></th><th class="r"><span class="hide-m">Rufb.</span><span class="show-m">Rb.</span></th><th class="r"><span class="hide-m">Abgeg.</span><span class="show-m">Ab.</span></th><th class="r"><span class="hide-m">davon So/Feiert.</span><span class="show-m">So/F.</span></th><th class="r">Betrag</th></tr>
      ${tr('Summe '+y,cnt(all),true)}${ms.map(x=>tr(MON[x.m],cnt(x.l))).join('')}</table>`:'<p class="muted" style="margin:0">Keine Rufbereitschaft eingetragen.</p>'}</div>`}).join('')+
      `<p class="muted" style="font-size:12.5px;margin:10px 4px">Sätze werktags / an Sonn- und Feiertagen: übernommen ${eur(rbPrice('ueb',''))} / ${eur(+(s.rbUebSoFei??5))}, Rufbereitschaft ${eur(+(s.rbVoll??5))} / ${eur(+(s.rbSoFei??10))}, abgegeben ${eur(rbPrice('abg',''))} / ${eur(+(s.rbAbgSoFei??5))}. Änderbar in den Einstellungen.</p>`;
  } else {
    const type=tab==='urlaub'?'Urlaub':'Krankheit';
    const ys=[...new Set([String(new Date().getFullYear()),...years])].sort().reverse();
    body=ys.map(y=>{const l=DB.entries.filter(e=>e.type===type&&e.date.startsWith(y)).sort((a,b)=>b.date.localeCompare(a.date));const n=new Set(l.map(e=>e.date)).size;
      let head=`<div class="sec"><span>${y}</span><span>${n} ${n===1?'Tag':'Tage'}</span></div>`;
      if(type==='Urlaub'&&s.vacationPerYear){const carry=+((s.vacationCarry||{})[y]||0);const rest=s.vacationPerYear+carry-n;
        head=`<div class="sec"><span>${y}</span></div><div class="card vac"><div class="hero" style="margin:0"><div><div class="muted" style="font-size:13px">Resturlaub</div><div class="big num">${fmt(rest)} Tage</div></div>
        <div class="muted num" style="font-size:13px;text-align:right;line-height:1.9">Anspruch ${fmt(s.vacationPerYear)}<br>Übertrag <input type="number" step="0.5" data-carry="${y}" value="${carry}" style="width:64px;min-height:28px;padding:2px 6px;text-align:right"><br>Genommen ${n}</div></div></div>`;}
      return head+(l.map(e=>`<div class="muted" style="font-size:12.5px;margin:10px 4px 4px">${dlbl(e.date)}</div>${entryHtml(e)}`).join('')||'<div class="empty">Keine Einträge.</div>')}).join('');
  }
  M.innerHTML=topBar('Auswertung')+`<div class="wrap"><div class="tabs noprint">${[['ueber','Überstunden'],['jahre','Jahre'],['urlaub','Urlaub'],['krank','Krankheit'],['rb','Rufbereitschaft']].map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>${body}</div>`;
  M.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  M.querySelectorAll('[data-carry]').forEach(i=>i.onchange=()=>{s.vacationCarry={...(s.vacationCarry||{}),[i.dataset.carry]:parseFloat(i.value)||0};saveSettings();render()});
  M.querySelectorAll('[data-pay]').forEach(i=>i.onchange=()=>{const o={...(s.overtimePayout||{})};const v=parseFloat(i.value)||0;if(v)o[i.dataset.pay]=v;else delete o[i.dataset.pay];s.overtimePayout=o;saveSettings();render()});
  M.querySelectorAll('[data-ocarry]').forEach(i=>i.onchange=()=>{const o={...(s.overtimeCarry||{})};if(i.value==='')delete o[i.dataset.ocarry];else o[i.dataset.ocarry]=parseFloat(i.value)||0;s.overtimeCarry=o;saveSettings();render()});
  bindEntries();
}

const DECO_BITS=8, DECO_GROUND=11;
function renderDeco(){
  let el=document.getElementById('deco'); const s=seasonActive();
  if(!s){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='deco';el.setAttribute('aria-hidden','true');document.body.appendChild(el)}
  const d=DECO[s];
  // feste, gleichmäßig verteilte Bahnen statt Zufall: gleiche Wirkung bei jedem Start, keine Häufungen
  const bits=[...Array(DECO_BITS)].map((_,i)=>{const x=(i*100/DECO_BITS+6+(i%3)*4)%100, dur=12+(i*5)%9, delay=-(i*2.7), size=18+(i*5)%12;
    return `<span class="bit" style="left:${x.toFixed(1)}%;width:${size}px;animation-duration:${dur}s;animation-delay:${delay.toFixed(1)}s"><i style="animation-duration:${3+(i%3)}s">${d.bits[i%d.bits.length]}</i></span>`}).join('');
  // Boden (Gras, Blumen): feste Plätze am unteren Rand, wiegen sich leicht im Wind
  const G=d.ground||[], ground=G.length?`<div class="ground">${[...Array(DECO_GROUND)].map((_,i)=>{const x=6+i*(90/(DECO_GROUND-1)), w=26+(i*7)%16;
    return `<span class="tuft" style="left:${x.toFixed(1)}%;width:${w}px;margin-left:${-w/2}px;animation-duration:${2.6+(i%4)*.5}s;animation-delay:${-(i*.4).toFixed(1)}s">${G[i%G.length]}</span>`}).join('')}</div>`:'';
  el.className='deco '+s; el.innerHTML=bits+ground+`<span class="pet">${d.pet}</span>`;
}

function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function downloadCsv(list,name){
  const rows=[['Datum','Wochentag','Art','Beginn','Ende','Pause (Min.)','Stunden','Grund','Beschreibung']];
  list.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start||'')).forEach(e=>rows.push([e.date.split('-').reverse().join('.'),WD[parseIso(e.date).getDay()],e.type,e.start||'',e.end||'',e.pause||'',fmt(hours(e)),e.reason||'',e.note||'']));

}

function editEntry(e){
  const s=DB.settings; const isNew=!e;
  e=e?{...e}:{id:uid(),date:selDate,type:'Arbeit',start:s.defaultStart,end:s.defaultEnd,pause:s.defaultPause,note:''};
  const origDate=e.date; let rb=rbOf(e.date); let ackPause=false;
  // Pausen-Erinnerung (Vorgabe vom 11.11.2026): ab 6 Std. Arbeit am Tag 30 Min., ab 9 Std. 45 Min. – die Grenzwerte selbst zählen schon mit.
  // Gezählt wird der ganze Tag: Pausen aller Arbeitseinträge plus Lücken zwischen ihnen. Nur Erinnerung, kein Zwang.
  const pauseCheck=b=>{const day=DB.entries.filter(x=>x.type==='Arbeit'&&x.date===b.date&&x.id!==b.id).concat([b]).map(x=>{let a=toMin(x.start),z=toMin(x.end);if(z<a)z+=1440;return{a,z,p:+x.pause||0}}).sort((p,q)=>p.a-q.a);
    // Lücke = Zeit zwischen dem bisher spätesten Ende und dem nächsten Beginn. Überschneiden sich Einträge, entsteht keine Lücke.
    let gross=0,own=0,gaps=0,maxEnd=-1;day.forEach((x,i)=>{gross+=x.z-x.a;own+=x.p;if(i)gaps+=Math.max(0,x.a-maxEnd);maxEnd=Math.max(maxEnd,x.z)});
    const work=gross-own,need=work>=540?45:work>=360?30:0,pause=own+gaps;
    return need&&pause<need?{work,need,pause,miss:need-pause,n:day.length}:null};
  const F=document.getElementById('dlgForm'), D=document.getElementById('dlg');
  // Diktieren ins Feld „Beschreibung“ über die Spracherkennung des Browsers (nicht in jedem Browser vorhanden; dann fehlt der Knopf).
  // Es wird Satz für Satz erkannt und nach jeder Sprechpause neu gestartet – das vermeidet doppelte Wörter auf Android.
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null, micOn=false;
  const MIC='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/></svg>';
  const micStop=()=>{micOn=false;if(rec){try{rec.abort()}catch(x){}}};
  const micShow=()=>{const b=F.querySelector('#f_mic');if(!b)return;b.classList.toggle('on',micOn);b.setAttribute('aria-pressed',micOn);b.querySelector('span').textContent=micOn?'Aufnahme läuft – beenden':'Diktieren'};
  const micStart=()=>{const ta=F.querySelector('#f_note');if(!ta){micOn=false;return}
    const base=ta.value.replace(/\s+$/,'');
    rec=new SR();rec.lang='de-DE';rec.continuous=false;rec.interimResults=true;
    rec.onresult=ev=>{const t=Array.from(ev.results).map(r=>r[0].transcript).join('').trim();ta.value=((base?base+' ':'')+t).slice(0,1000);e.note=ta.value};
    rec.onerror=ev=>{micOn=false;if(ev.error!=='aborted')toast(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'Mikrofon ist für diese Seite nicht erlaubt':ev.error==='no-speech'?'Nichts gehört – Aufnahme beendet':ev.error==='network'?'Spracherkennung braucht Internet':'Spracherkennung: '+ev.error)};
    rec.onend=()=>{rec=null;if(micOn&&D.open){try{micStart()}catch(x){micOn=false}}micShow()};
    rec.start()};
  const draw=()=>{
    micStop();
    const work=e.type==='Arbeit';
    F.innerHTML=`<h2>${isNew?'Neuer Eintrag':'Eintrag bearbeiten'}</h2>
    <div class="seg">${['Arbeit','Urlaub','Krankheit'].map(t=>`<button type="button" data-t="${t}" class="${e.type===t?'on':''}">${t}</button>`).join('')}</div>
    <div class="grid ${!work&&isNew?'g2':''}"><div><label for="f_date">${work||!isNew?'Datum':'Von'}</label><input type="date" id="f_date" value="${e.date}" required></div>
     ${!work&&isNew?`<div><label for="f_to">Bis</label><input type="date" id="f_to" value="${e._to||e.date}"></div>`:''}</div>
    ${work?`<div class="grid g3"><div><label for="f_start">Beginn</label><input type="time" id="f_start" value="${e.start}" required></div><div><label for="f_end">Ende</label><input type="time" id="f_end" value="${e.end}" required></div><div><label for="f_pause">Pause (Min.)</label><input type="number" inputmode="numeric" id="f_pause" min="0" step="5" value="${e.pause||0}"></div></div>`
     :`<div class="grid g2"><div><label for="f_hours">Stunden pro Tag</label><input type="number" inputmode="decimal" step="0.01" id="f_hours" value="${e.hours??s.dailySoll}"></div><div><label for="f_reason">Grund</label><input id="f_reason" value="${esc(e.reason||(e.type==='Urlaub'?'Ganzer Tag':''))}"></div></div>`}
    ${work?`<div role="group" aria-label="Rufbereitschaft an diesem Tag"><label>Rufbereitschaft an diesem Tag (höchstens eine Auswahl)</label>
     ${RB_KINDS.map(([k,l])=>`<label class="chk"><input type="checkbox" data-rb="${k}" ${rb===k?'checked':''}><span>${l}</span><span class="muted num" data-rbp="${k}"></span></label>`).join('')}</div>`:''}
    <div><div class="lblrow"><label for="f_note">Beschreibung</label>${SR?`<button type="button" class="btn small mic" id="f_mic" aria-pressed="false">${MIC}<span>Diktieren</span></button>`:''}</div><textarea id="f_note" rows="3" maxlength="1000" style="resize:vertical" placeholder="Optional">${esc(e.note)}</textarea></div>
    <div class="calc num" id="f_sum"></div>
    <div id="f_warn" role="alert"></div>
    <div class="actions">${isNew?'<span></span>':'<button type="button" class="btn danger" id="f_del">Löschen</button>'}
     <span><button type="button" class="btn" id="f_cancel">Abbrechen</button><button class="btn pri" id="f_ok">Speichern</button></span></div>`;
    F.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{read();e.type=b.dataset.t;draw()});
    F.querySelector('#f_cancel').onclick=()=>D.close();
    const mic=F.querySelector('#f_mic'); if(mic) mic.onclick=()=>{if(micOn){micStop();micShow();return} micOn=true;try{micStart()}catch(x){micOn=false;rec=null;toast('Spracherkennung konnte nicht starten')}micShow()};
    const del=F.querySelector('#f_del'); if(del) del.onclick=()=>{if(confirm('Eintrag wirklich löschen?')){D.close();deleteEntry(e.id)}};
    // Nur eine der drei Rufbereitschafts-Arten kann gewählt sein; ein zweiter Klick auf die gewählte nimmt sie wieder heraus.
    F.querySelectorAll('[data-rb]').forEach(c=>c.onchange=()=>{rb=c.checked?c.dataset.rb:'';F.querySelectorAll('[data-rb]').forEach(o=>o.checked=o.dataset.rb===rb)});
    const upd=()=>{read();const el=F.querySelector('#f_sum');
      F.querySelectorAll('[data-rbp]').forEach(p=>p.textContent=eur(rbPrice(p.dataset.rbp,e.date)));
      if(e.type==='Arbeit'&&e.start&&e.end) el.textContent=`= ${fmt(hours(e))} Stunden`;
      else if(isNew&&e._to&&e._to>e.date){let n=0;for(let d=parseIso(e.date);iso(d)<=e._to;d.setDate(d.getDate()+1))if(isWorkday(d))n++;el.textContent=`${n} Arbeitstage werden eingetragen`}
      else el.textContent='';};
    F.querySelectorAll('input').forEach(i=>i.oninput=upd); upd();
  };
  const read=()=>{const v=id=>{const el=F.querySelector('#'+id);return el?el.value:undefined};
    e.date=v('f_date')||e.date; const n=v('f_note'); if(n!==undefined)e.note=n;
    if(e.type==='Arbeit'){e.start=v('f_start')||e.start||s.defaultStart;e.end=v('f_end')||e.end||s.defaultEnd;const p=v('f_pause');e.pause=parseInt(p!==undefined?p:(e.pause||0))||0;delete e.hours;delete e.reason}
    else{const h=v('f_hours');e.hours=parseFloat(h!==undefined?h:(e.hours??s.dailySoll));const r=v('f_reason');if(r!==undefined)e.reason=r;const t=v('f_to');if(t!==undefined)e._to=t}};
  F.onsubmit=ev=>{ev.preventDefault();read();
    const base={...e}; delete base._to;
    if(base.type==='Arbeit'&&(!base.start||!base.end)) return toast('Bitte Beginn und Ende angeben');
    const pw=base.type==='Arbeit'&&!ackPause?pauseCheck(base):null;
    if(pw){const W=F.querySelector('#f_warn');
      W.innerHTML=`<div class="warn"><b>Gesetzliche Pause beachten</b><br>An diesem Tag sind ${hmin(pw.work/60)} Stunden Arbeit eingetragen. Ab ${pw.need===45?9:6} Stunden sind ${pw.need} Minuten Pause vorgeschrieben, eingetragen sind ${pw.pause} Minuten${pw.n>1?' (Pausen und Lücken zwischen den Einträgen des Tages mitgezählt)':''}.
        <div class="warnbtn"><button type="button" class="btn small pri" id="w_fill">${pw.miss} Min. Pause eintragen</button><button type="button" class="btn small" id="w_skip">Ohne Pause speichern</button></div></div>`;
      W.querySelector('#w_fill').onclick=()=>{const p=F.querySelector('#f_pause');p.value=(parseInt(p.value)||0)+pw.miss;W.innerHTML='';p.dispatchEvent(new Event('input'));p.focus()};
      W.querySelector('#w_skip').onclick=()=>{ackPause=true;F.requestSubmit()};
      W.scrollIntoView({block:'nearest'}); return}
    if(base.type!=='Arbeit'){delete base.start;delete base.end;delete base.pause;if(isNaN(base.hours))base.hours=s.dailySoll}
    let changed=[];
    if(isNew&&e.type!=='Arbeit'&&e._to&&e._to>e.date){
      for(let d=parseIso(e.date);iso(d)<=e._to;d.setDate(d.getDate()+1)){ if(isWorkday(d)) changed.push({...base,id:uid(),date:iso(d)}); }
      if(!changed.length) return toast('Keine Arbeitstage im Zeitraum');
      DB.entries.push(...changed);
    } else { const i=DB.entries.findIndex(x=>x.id===base.id); if(i>=0)DB.entries[i]=base; else DB.entries.push(base); changed=[base]; }
    if(base.type==='Arbeit'){const o={...(s.rb||{})}; if(rb)o[base.date]=rb; else delete o[base.date];
      if(origDate!==base.date&&!DB.entries.some(x=>x.date===origDate)) delete o[origDate];
      if(JSON.stringify(o)!==JSON.stringify(s.rb||{})){s.rb=o;saveSettings()}}
    D.close(); selDate=base.date; render();
    saveEntries(changed).then(ok=>toast(ok?(changed.length>1?changed.length+' Einträge gespeichert':'Gespeichert'):'Keine Verbindung – wird automatisch nachgesendet, sobald Internet da ist'));
  };
  D.addEventListener('close',micStop,{once:true});
  draw(); D.showModal();
}

// ---------- Passwort ----------
function passwordDialog(recovery){
  const F=document.getElementById('dlgForm'), D=document.getElementById('dlg');
  F.innerHTML=`<h2>${recovery?'Neues Passwort festlegen':'Passwort ändern'}</h2>
   <div class="grid"><div><label for="p1">Neues Passwort</label><input type="password" id="p1" minlength="8" autocomplete="new-password" required></div>
   <div><label for="p2">Wiederholen</label><input type="password" id="p2" minlength="8" autocomplete="new-password" required></div></div>
   <div class="calc" id="pmsg" style="color:var(--mut);font-weight:500;font-size:13px">Mindestens 8 Zeichen.</div>
   <div class="actions"><span></span><span><button type="button" class="btn" id="pc">Abbrechen</button><button class="btn pri">Speichern</button></span></div>`;
  F.querySelector('#pc').onclick=()=>D.close();
  F.onsubmit=async ev=>{ev.preventDefault();const a=F.querySelector('#p1').value,b=F.querySelector('#p2').value;
    if(a!==b) return F.querySelector('#pmsg').textContent='Die Passwörter stimmen nicht überein.';
    const {error}=await sb.auth.updateUser({password:a});
    if(error) return F.querySelector('#pmsg').textContent='Fehler: '+error.message;
    D.close(); toast('Passwort geändert');};
  D.showModal();
}

// ---------- Anmeldung ----------
function vLogin(msg=''){
  M=null;
  R.innerHTML=`<div class="login"><div class="box"><img src="icon.svg" alt=""><h1>Zeiterfassung</h1><p class="muted">Bitte anmelden</p>
   <form class="card" id="lf"><div class="grid"><div><label for="le">E-Mail</label><input type="email" id="le" autocomplete="username" required></div>
   <div><label for="lp">Passwort</label><input type="password" id="lp" autocomplete="current-password" required></div></div>
   <button class="btn pri" style="width:100%;min-height:46px">Anmelden</button>
   <div style="text-align:center;margin-top:8px"><button type="button" class="linkbtn" id="forgot">Passwort vergessen?</button></div>
   <div class="msg" id="lm">${esc(msg)}</div></form></div></div>`;
  const lm=document.getElementById('lm');
  document.getElementById('lf').onsubmit=async ev=>{ev.preventDefault();lm.className='msg';lm.textContent='Anmeldung…';
    const {error}=await sb.auth.signInWithPassword({email:document.getElementById('le').value.trim(),password:document.getElementById('lp').value});
    if(error){lm.className='msg err';lm.textContent=/invalid/i.test(error.message)?'E-Mail oder Passwort falsch.':error.message;}};
  document.getElementById('forgot').onclick=async()=>{const em=document.getElementById('le').value.trim();
    if(!em){lm.className='msg err';lm.textContent='Bitte zuerst die E-Mail-Adresse eintragen.';return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    lm.className=error?'msg err':'msg';lm.textContent=error?error.message:'Falls ein Konto existiert, wurde eine E-Mail zum Zurücksetzen verschickt.';};
}
let booted=null;
async function boot(user){
  if(booted===user.id) return; booted=user.id; USER=user; pendLoad();
  const had=cacheLoad(); shell(); render();
  if(!had) M.innerHTML=topBar('Zeiterfassung')+'<div class="wrap"><div class="empty">Daten werden geladen…</div></div>';
  await refresh(false);
}
sb.auth.onAuthStateChange((event,session)=>{
  setTimeout(()=>{ // außerhalb des Auth-Callbacks weiterarbeiten
    if(event==='PASSWORD_RECOVERY'&&session){boot(session.user).then(()=>passwordDialog(true));return}
    if(session&&session.user) boot(session.user);
    else if(event!=='TOKEN_REFRESHED'){cacheClearAll();booted=null;USER=null;PEND={entries:{},settings:0};M=null;DB={settings:{...DEFAULT_SETTINGS},entries:[]};vLogin();}
  },0);
});
// Beim Zurückkehren zur App (z. B. am Handy) Änderungen vom anderen Gerät holen
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&USER&&Date.now()-lastFetch>30000&&!document.getElementById('dlg').open)refresh(true)});
</script>
